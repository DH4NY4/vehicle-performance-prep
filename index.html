<script>
// Interactive tools. All numbers illustrative.
window.Pages = window.Pages || {};
const UI = {
  slider(id, label, min, max, step, value, unit = '') {
    return `<label for="${id}">${label}</label><div class="slider"><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}"><output id="${id}-o">${value}${unit}</output></div>`;
  },
  bind(el, ids, fn, units = {}) {
    ids.forEach(id => { const i = el.querySelector('#' + id); const ev = i.tagName === 'SELECT' ? 'change' : 'input';
      i.addEventListener(ev, () => { const o = el.querySelector('#' + id + '-o'); if (o) o.textContent = i.value + (units[id] || ''); fn(); }); });
    fn();
  },
  val: (el, id) => parseFloat(el.querySelector('#' + id).value),
  trackSelect: (id = 'trk') => `<label for="${id}">Circuit</label><select id="${id}">${Object.entries(Model.TRACKS).map(([k, t]) => `<option value="${k}">${t.name}</option>`).join('')}</select>`,
  head: (title, lead) => `<div class="crumb">Tools</div><h1>${title}</h1><p class="lead">${lead}</p>`,
  kv: rows => `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`
};
const kph = v => (v * 3.6).toFixed(0) + ' km/h';
const COL = { a: 'var(--accent)', b: 'var(--soft)', c: 'var(--good)', d: 'var(--warn)' };

Pages['tools/lapsim'] = { group: 'Tools', title: 'Lap sim', blurb: 'Point-mass lap time simulation',
  render(el) {
    const B = Model.BASE;
    el.innerHTML = UI.head('Lap sim', 'A point-mass lap time simulation: apex speed limits, a forward pass for acceleration and a backward pass for braking. Change the car and see where the time goes. The dashed line is the baseline car.') + `
    <div class="panel"><div class="row">
      <div>${UI.trackSelect()}</div>
      <div>${UI.slider('m', 'Mass (kg)', 700, 900, 5, B.m)}</div>
      <div>${UI.slider('cl', 'Downforce C<sub>L</sub>A (m²)', 1.5, 8, 0.1, B.ClA)}</div>
      <div>${UI.slider('cd', 'Drag C<sub>D</sub>A (m²)', 0.6, 3, 0.05, B.CdA)}</div>
      <div>${UI.slider('p', 'Power (kW)', 500, 900, 10, B.P)}</div>
      <div>${UI.slider('mu', 'Tyre grip µ', 1.2, 2.0, 0.02, B.mu)}</div>
    </div></div>
    <div class="panel"><div id="res"></div><div id="ch"></div><div id="ap"></div></div>
    <div class="note">What to notice: mass and grip change almost every corner; drag mainly the straights; power only where the car is power-limited. On the twisty circuit, downforce is worth far more than drag costs.</div>`;
    UI.bind(el, ['trk', 'm', 'cl', 'cd', 'p', 'mu'], () => {
      const trk = el.querySelector('#trk').value;
      const car = { m: UI.val(el, 'm'), ClA: UI.val(el, 'cl'), CdA: UI.val(el, 'cd'), P: UI.val(el, 'p'), mu: UI.val(el, 'mu') };
      const s = Model.lapSim(car, trk), b = Model.lapSim({}, trk), d = s.lapTime - b.lapTime;
      el.querySelector('#res').innerHTML = `<div class="score"><span>Lap time <b class="big" style="font-size:1.8rem">${Model.fmtTime(s.lapTime)}</b></span>
        <span>vs baseline <b class="${d < -0.0005 ? 'verdict-good' : d > 0.0005 ? 'verdict-bad' : ''}">${Model.sgn(d, 3)} s</b></span>
        <span>Top speed <b>${kph(Math.max(...s.v))}</b></span><span>Full throttle <b>${(s.fullThrottle * 100).toFixed(0)}%</b></span><span>Length <b>${(s.length / 1000).toFixed(2)} km</b></span></div>`;
      const step = 10, ds = (arr) => arr.filter((_, i) => i % step === 0);
      const pts = (sim) => ds(sim.x).map((x, i) => ({ x, y: sim.v[i * step] * 3.6 }));
      el.querySelector('#ch').innerHTML = Charts.line([{ points: pts(b), color: 'var(--muted)', dash: true }, { points: pts(s), color: COL.a }], { xLabel: 'Distance (m)', yLabel: 'Speed (km/h)', aria: 'Speed against distance' });
      el.querySelector('#ap').innerHTML = `<table><tr><th>Corner</th><th class="num">Radius (m)</th><th class="num">Apex speed</th><th class="num">Baseline</th></tr>${s.corners.map((c, i) => `<tr><td>${c.name}</td><td class="num">${c.r}</td><td class="num">${kph(c.apex)}</td><td class="num">${kph(b.corners[i].apex)}</td></tr>`).join('')}</table>`;
    }, { m: '', cl: '', cd: '', p: '', mu: '' });
  } };

Pages['tools/sweep'] = { group: 'Tools', title: 'Setup sweep', blurb: 'Lap time against one parameter',
  render(el) {
    el.innerHTML = UI.head('Setup sweep', 'Vary one parameter, simulate each value and find the optimum. For the wing sweep, drag rises with downforce (C<sub>D</sub>A = 0.3 + 0.15·C<sub>L</sub>A + 0.03·C<sub>L</sub>A²), so there is a real trade-off.') + `
    <div class="panel"><div class="row"><div>${UI.trackSelect()}</div>
      <div><label for="par">Parameter</label><select id="par"><option value="wing">Wing level (C<sub>L</sub>A with drag)</option><option value="m">Mass</option><option value="P">Power</option><option value="mu">Tyre grip µ</option></select></div>
      <div>${UI.slider('hi', 'Wing sweep: maximum C<sub>L</sub>A', 4, 10, 0.5, 6)}</div></div></div>
    <div class="panel"><div id="res"></div><div id="ch"></div></div>
    <div class="note">Try the twisty circuit with the maximum at 6: the best value sits at the edge of the range, which means the sweep was not wide enough. Extend it before you trust the answer.</div>`;
    UI.bind(el, ['trk', 'par', 'hi'], () => {
      const trk = el.querySelector('#trk').value, par = el.querySelector('#par').value, hi = UI.val(el, 'hi');
      const spec = { wing: [1.5, hi, 0.25, 'C_L·A (m²)', v => Model.wingCar(v)], m: [720, 880, 10, 'Mass (kg)', v => ({ m: v })], P: [550, 900, 25, 'Power (kW)', v => ({ P: v })], mu: [1.3, 1.9, 0.05, 'Tyre grip µ', v => ({ mu: v })] }[par];
      const pts = []; for (let v = spec[0]; v <= spec[1] + 1e-9; v += spec[2]) pts.push({ x: +v.toFixed(3), y: Model.lapSim(spec[4](v), trk).lapTime });
      const best = pts.reduce((a, b) => (b.y < a.y ? b : a)), edge = best === pts[0] || best === pts[pts.length - 1];
      el.querySelector('#res').innerHTML = UI.kv([['Best value', `${best.x} ${par === 'wing' ? 'm² (C_D·A ' + Model.wingCar(best.x).CdA.toFixed(2) + ' m²)' : ''}`], ['Best lap', Model.fmtTime(best.y)], ['Spread across sweep', (Math.max(...pts.map(p => p.y)) - best.y).toFixed(3) + ' s']]) +
        (edge && par === 'wing' ? '<div class="note warn">The optimum is at the edge of the swept range. Extend the range before trusting it.</div>' : edge ? '<div class="note">For this parameter, more (or less) is simply better: there is no trade-off inside the model. In reality, other limits apply (tyre wear, reliability, rules).</div>' : '');
      el.querySelector('#ch').innerHTML = Charts.line([{ points: pts, color: COL.a }], { xLabel: spec[3], yLabel: 'Lap time (s)', mark: { x: best.x, y: best.y, label: 'best' }, aria: 'Lap time against parameter' });
    }, { hi: ' m²' });
  } };

Pages['tools/sensitivity'] = { group: 'Tools', title: 'Sensitivity table', blurb: 'Which variable matters most',
  render(el) {
    el.innerHTML = UI.head('Sensitivity table', 'Lap time change for a +1% change in each input on the baseline car. Compare the circuits: the ranking changes, and that ranking guides which upgrades to chase.') + `
    <div class="panel">${UI.trackSelect()}</div><div class="panel"><div id="ch"></div><div id="tb"></div></div>
    <div class="note">Negative means faster. Per-unit values (ms per kg, ms per kW) are what teams quote when judging upgrades. They are linear estimates, valid for small changes only.</div>`;
    UI.bind(el, ['trk'], () => {
      const trk = el.querySelector('#trk').value, s = Model.sensitivities({}, trk), B = Model.BASE;
      el.querySelector('#ch').innerHTML = Charts.bars(s.rows.map(r => ({ label: r.label, value: r.dt })), { unit: ' ms', aria: 'Lap time sensitivities' });
      el.querySelector('#tb').innerHTML = `<p>Baseline lap: <b>${Model.fmtTime(s.base)}</b></p><table><tr><th>Input (+1%)</th><th class="num">Δ lap time</th><th class="num">Per unit</th></tr>${s.rows.map(r => {
        const perTxt = r.key === 'm' ? Model.sgn(r.dt / (B.m / 100), 1) + ' ms/kg' : r.key === 'P' ? Model.sgn(r.dt / (B.P / 100), 2) + ' ms/kW' : r.key === 'mu' ? Model.sgn(r.dt / (B.mu / 100) * 0.01, 0) + ' ms per +0.01' : Model.sgn(r.dt / (B[r.key] / 100) * 0.1, 0) + ' ms per +0.1 m²';
        return `<tr><td>${r.label}</td><td class="num">${Model.sgn(r.dt, 0)} ms</td><td class="num">${perTxt}</td></tr>`; }).join('')}</table>`;
    });
  } };

Pages['tools/loadtransfer'] = { group: 'Tools', title: 'Load transfer', blurb: 'Four corner loads and grip lost',
  render(el) {
    el.innerHTML = UI.head('Load transfer', 'Static weight plus lateral and longitudinal load transfer gives the four wheel loads. The front share of roll stiffness decides how lateral transfer splits between the axles. Downforce is ignored here to keep the numbers clear.') + `
    <div class="panel"><div class="row">
      <div>${UI.slider('m', 'Mass (kg)', 700, 900, 10, 800)}</div><div>${UI.slider('h', 'CoG height (m)', 0.2, 0.4, 0.01, 0.3)}</div>
      <div>${UI.slider('t', 'Track width (m)', 1.4, 1.7, 0.01, 1.6)}</div><div>${UI.slider('L', 'Wheelbase (m)', 3.0, 3.6, 0.05, 3.4)}</div>
      <div>${UI.slider('wf', 'Static front weight (%)', 40, 50, 0.5, 45)}</div><div>${UI.slider('rs', 'Front roll stiffness share (%)', 30, 70, 1, 50)}</div>
      <div>${UI.slider('ay', 'Lateral g (turning left)', 0, 3, 0.1, 1.5)}</div><div>${UI.slider('ax', 'Longitudinal g (+ accel, − brake)', -3, 1.5, 0.1, 0)}</div>
    </div></div><div class="panel"><div id="car"></div><div id="res"></div></div>
    <div class="note">Grip uses µ = 2.0 − 0.1 × F<sub>z</sub> (kN) per tyre to show load sensitivity. Move the roll stiffness share: total grip lost on each axle changes, and so does the balance.</div>`;
    UI.bind(el, ['m', 'h', 't', 'L', 'wf', 'rs', 'ay', 'ax'], () => {
      const m = UI.val(el, 'm'), h = UI.val(el, 'h'), t = UI.val(el, 't'), L = UI.val(el, 'L'), wf = UI.val(el, 'wf') / 100, rs = UI.val(el, 'rs') / 100, ay = UI.val(el, 'ay'), ax = UI.val(el, 'ax');
      const W = m * Model.g, lat = Model.latLT(m, ay, h, t), lon = Model.lonLT(m, ax, h, L);
      const F = W * wf - lon, R = W * (1 - wf) + lon;               // axle loads after longitudinal transfer
      const latF = lat * rs, latR = lat * (1 - rs);                 // turning left: load moves to right (outside) wheels
      const w = { FL: F / 2 - latF / 2, FR: F / 2 + latF / 2, RL: R / 2 - latR / 2, RR: R / 2 + latR / 2 };
      const grip = fz => { const k = Math.max(0, fz) / 1000; return Math.max(0, k * (2.0 - 0.1 * k)); };
      const axleGrip = (a, b) => grip(a) + grip(b), fNo = 2 * grip(F / 2), rNo = 2 * grip(R / 2), fG = axleGrip(w.FL, w.FR), rG = axleGrip(w.RL, w.RR);
      const lift = Object.values(w).some(v => v <= 0);
      const box = (x, y, k) => `<g><rect x="${x}" y="${y}" width="120" height="60" rx="8" fill="var(--sheet)" stroke="var(--rule-strong)"/><text x="${x + 60}" y="${y + 26}" text-anchor="middle" class="lbl">${k}</text><text x="${x + 60}" y="${y + 46}" text-anchor="middle">${(w[k] / 1000).toFixed(2)} kN</text></g>`;
      el.querySelector('#car').innerHTML = `<svg class="chart" viewBox="0 0 460 300" style="max-width:520px" role="img" aria-label="Four wheel loads">
        <rect x="150" y="40" width="160" height="220" rx="40" fill="none" stroke="var(--rule-strong)" stroke-width="2"/><text x="230" y="30" text-anchor="middle">front</text>
        ${box(20, 40, 'FL')}${box(320, 40, 'FR')}${box(20, 200, 'RL')}${box(320, 200, 'RR')}
        <text x="230" y="155" text-anchor="middle">turning left →</text><text x="230" y="175" text-anchor="middle">load moves right</text></svg>`;
      el.querySelector('#res').innerHTML = (lift ? '<div class="note warn">A wheel has lifted (zero load): the simple model no longer applies.</div>' : '') + UI.kv([
        ['Lateral transfer (total)', (lat / 1000).toFixed(2) + ' kN'], ['Longitudinal transfer', (lon / 1000).toFixed(2) + ' kN ' + (ax < 0 ? 'to the front' : ax > 0 ? 'to the rear' : '')],
        ['Front axle grip', `${fG.toFixed(2)} kN (${((fG / fNo - 1) * 100).toFixed(1)}% vs equal loads)`], ['Rear axle grip', `${rG.toFixed(2)} kN (${((rG / rNo - 1) * 100).toFixed(1)}% vs equal loads)`]]);
    });
  } };

Pages['tools/tyre'] = { group: 'Tools', title: 'Tyre curve', blurb: 'Magic Formula and load sensitivity',
  render(el) {
    el.innerHTML = UI.head('Tyre curve', 'Lateral force against slip angle from the Pacejka Magic Formula, at your chosen load and at 50% more load. The peak force D = µ(F<sub>z</sub>)·F<sub>z</sub>, where µ falls as load rises.') + `
    <div class="panel"><div class="row">
      <div>${UI.slider('B', 'B (stiffness factor, per radian)', 5, 40, 0.5, 20)}</div><div>${UI.slider('C', 'C (shape factor)', 1.0, 2.0, 0.05, 1.3)}</div>
      <div>${UI.slider('E', 'E (curvature factor)', -2, 1, 0.05, 0)}</div><div>${UI.slider('fz', 'Vertical load F<sub>z</sub> (kN)', 2, 10, 0.5, 4)}</div>
      <div>${UI.slider('mu0', 'µ at 4 kN', 1.4, 2.2, 0.05, 1.8)}</div><div>${UI.slider('ls', 'Load sensitivity (µ drop per kN)', 0, 0.12, 0.005, 0.075)}</div>
    </div></div><div class="panel"><div id="ch"></div><div id="res"></div></div>
    <div class="note">B·C·D is the cornering stiffness (slope at zero slip). Raise E towards 1 for a flatter peak; lower E (negative) for a sharper drop after the peak.</div>`;
    UI.bind(el, ['B', 'C', 'E', 'fz', 'mu0', 'ls'], () => {
      const B = UI.val(el, 'B'), C = UI.val(el, 'C'), E = UI.val(el, 'E'), fz = UI.val(el, 'fz'), mu0 = UI.val(el, 'mu0'), ls = UI.val(el, 'ls');
      const mu = z => Math.max(0.3, mu0 - ls * (z - 4)), curve = z => { const D = mu(z) * z, pts = []; for (let a = 0; a <= 20; a += 0.25) pts.push({ x: a, y: Model.pacejka(a * Math.PI / 180, B, C, D, E) }); return pts; };
      const c1 = curve(fz), c2 = curve(fz * 1.5), pk1 = Math.max(...c1.map(p => p.y)), pk2 = Math.max(...c2.map(p => p.y)), at = c1.find(p => p.y === pk1).x;
      el.querySelector('#ch').innerHTML = Charts.line([{ name: `${fz} kN`, points: c1, color: COL.a }, { name: `${(fz * 1.5).toFixed(1)} kN`, points: c2, color: COL.b, dash: true }], { xLabel: 'Slip angle (degrees)', yLabel: 'Lateral force (kN)', aria: 'Tyre lateral force against slip angle' });
      el.querySelector('#res').innerHTML = UI.kv([['Peak force at ' + fz + ' kN', `${pk1.toFixed(2)} kN at about ${at}°`], ['Peak at 50% more load', `${pk2.toFixed(2)} kN: ${((pk2 / pk1 - 1) * 100).toFixed(0)}% more grip for 50% more load`]]);
    });
  } };

Pages['tools/aero'] = { group: 'Tools', title: 'Downforce and drag', blurb: 'The V² law in numbers',
  render(el) {
    el.innerHTML = UI.head('Downforce and drag', 'Downforce and drag rise with speed squared; drag power with speed cubed. Compare downforce with the car\'s weight to see where aero grip takes over from mechanical grip.') + `
    <div class="panel"><div class="row">
      <div>${UI.slider('v', 'Speed (km/h)', 50, 350, 5, 250)}</div><div>${UI.slider('cl', 'C<sub>L</sub>A (m²)', 1, 8, 0.1, 4)}</div>
      <div>${UI.slider('cd', 'C<sub>D</sub>A (m²)', 0.5, 3, 0.05, 1.2)}</div><div>${UI.slider('rho', 'Air density ρ (kg/m³)', 0.9, 1.3, 0.01, 1.2)}</div>
      <div>${UI.slider('m', 'Mass (kg)', 700, 900, 10, 800)}</div></div></div>
    <div class="panel"><div id="res"></div><div id="ch"></div></div>
    <div class="note">Set ρ to 0.98 to see roughly what happens at a high-altitude circuit (about 2,240 m): about 20% less downforce and drag.</div>`;
    UI.bind(el, ['v', 'cl', 'cd', 'rho', 'm'], () => {
      const V = UI.val(el, 'v') / 3.6, cl = UI.val(el, 'cl'), cd = UI.val(el, 'cd'), rho = UI.val(el, 'rho'), m = UI.val(el, 'm');
      const DF = Model.downforce(rho, V, cl), D = Model.drag(rho, V, cd), W = m * Model.g, vEq = Math.sqrt(W / (0.5 * rho * cl));
      el.querySelector('#res').innerHTML = UI.kv([['Downforce', `${(DF / 1000).toFixed(2)} kN (${(DF / W).toFixed(2)} × weight)`], ['Drag', `${(D / 1000).toFixed(2)} kN`], ['Drag power', `${(Model.dragPower(rho, V, cd) / 1000).toFixed(0)} kW`], ['L/D', (cl / cd).toFixed(2)], ['Downforce equals weight at', kph(vEq)]]);
      const pts = k => { const a = []; for (let s = 0; s <= 350; s += 10) a.push({ x: s, y: (k === 'df' ? Model.downforce(rho, s / 3.6, cl) : Model.drag(rho, s / 3.6, cd)) / 1000 }); return a; };
      el.querySelector('#ch').innerHTML = Charts.line([{ name: 'Downforce', points: pts('df'), color: COL.a }, { name: 'Drag', points: pts('d'), color: COL.b }, { name: 'Weight', points: [{ x: 0, y: W / 1000 }, { x: 350, y: W / 1000 }], color: 'var(--muted)', dash: true }], { xLabel: 'Speed (km/h)', yLabel: 'Force (kN)', aria: 'Downforce and drag against speed' });
    });
  } };

Pages['tools/ride'] = { group: 'Tools', title: 'Ride and damping', blurb: 'Frequency, damping ratio, step response',
  render(el) {
    el.innerHTML = UI.head('Ride and damping', 'A single corner as a mass on a spring and damper: wheel rate from the motion ratio, natural frequency, damping ratio, and the response to a step input such as a kerb.') + `
    <div class="panel"><div class="row">
      <div>${UI.slider('m', 'Sprung mass on this corner (kg)', 100, 300, 5, 200)}</div><div>${UI.slider('k', 'Spring rate (N/mm)', 50, 400, 5, 200)}</div>
      <div>${UI.slider('mr', 'Motion ratio', 0.3, 1.2, 0.05, 0.6)}</div><div>${UI.slider('c', 'Damping at the wheel (N·s/m)', 500, 15000, 100, 4000)}</div></div></div>
    <div class="panel"><div id="res"></div><div id="ch"></div></div>
    <div class="note">Lower damping ratios overshoot and oscillate; a ratio of 1 is critically damped, with no overshoot. Real dampers are non-linear and tuned separately for body control and for bumps, which is what rig testing helps with. This is a linear, single-corner simplification.</div>`;
    UI.bind(el, ['m', 'k', 'mr', 'c'], () => {
      const m = UI.val(el, 'm'), k = UI.val(el, 'k') * 1000, mr = UI.val(el, 'mr'), c = UI.val(el, 'c');

      el.querySelector('#res').innerHTML = UI.kv([['Wheel rate', (kw / 1000).toFixed(1) + ' N/mm'], ['Natural frequency', f.toFixed(2) + ' Hz'], ['Damping ratio ζ', z.toFixed(2) + (z < 1 ? ' (underdamped)' : ' (overdamped or critical)')]]);
      el.querySelector('#ch').innerHTML = Charts.line([{ points: Model.stepResponse(f, z, Math.max(0.5, 3 / f)), color: COL.a }, { points: [{ x: 0, y: 1 }, { x: Math.max(0.5, 3 / f), y: 1 }], color: 'var(--muted)', dash: true }], { xLabel: 'Time (s)', yLabel: 'Body displacement (relative)', aria: 'Step response' });

Pages['tools/filter'] = { group: 'Tools', title: 'Signal filter', blurb: 'Smoothing against delay',
  render(el) {
    el.innerHTML = UI.head('Signal filter', 'A noisy braking event sampled at 100 Hz. A moving average smooths the noise but delays the signal; zero-phase filtering (forwards and backwards, done after the session) removes the delay.') + `
    <div class="panel"><div class="row"><div>${UI.slider('n', 'Moving average window (samples)', 1, 41, 2, 11)}</div><div>${UI.slider('ns', 'Noise level', 0, 0.6, 0.05, 0.25)}</div>
      <div><label for="zp">Filter type</label><select id="zp"><option value="0">Moving average (causal, live)</option><option value="1">Zero-phase (offline)</option></select></div></div>
      <button class="btn ghost" id="re">New noise</button></div>
    <div class="panel"><div id="res"></div><div id="ch"></div></div>`;
    let seed = []; const N = 200; const reseed = () => { seed = Array.from({ length: N }, () => Model.randn()); };
    reseed();
    const draw = () => {
      const n = UI.val(el, 'n'), ns = UI.val(el, 'ns'), zp = el.querySelector('#zp').value === '1', fs = 100;
      const truth = Array.from({ length: N }, (_, i) => { const t = i / fs; return t < 0.6 ? 0.2 : t < 0.7 ? 0.2 - 50 * (t - 0.6) : t < 1.4 ? -4.8 : t < 1.5 ? -4.8 + 48 * (t - 1.4) : 0; });
      const raw = truth.map((v, i) => v + ns * 4 * seed[i] / 2);
      const ma = arr => arr.map((_, i) => { let s = 0, c = 0; for (let j = i - n + 1; j <= i; j++) if (j >= 0) { s += arr[j]; c++; } return s / c; });
      let out = ma(raw); if (zp) out = ma(out.slice().reverse()).reverse();
      const P = arr => arr.map((y, i) => ({ x: i / fs, y }));
      const lag = zp ? 0 : (n - 1) / 2 / fs;
      el.querySelector('#res').innerHTML = UI.kv([['Delay', `${(lag * 1000).toFixed(0)} ms${zp ? ' (zero-phase)' : ''}`], ['Position error at 300 km/h', `${(lag * 83.3).toFixed(1)} m`]]);
      el.querySelector('#ch').innerHTML = Charts.line([{ points: P(raw), color: 'var(--rule-strong)' }, { name: 'True', points: P(truth), color: 'var(--muted)', dash: true }, { name: 'Filtered', points: P(out), color: COL.b }], { xLabel: 'Time (s)', yLabel: 'Longitudinal g', aria: 'Raw, true and filtered signals' });
    };
    UI.bind(el, ['n', 'ns', 'zp'], draw);
    el.querySelector('#re').onclick = () => { reseed(); draw(); };
  } };

</script>
<script>
// Randomised question generators. Each returns {q, ans, tol, unit, sol}. tol is absolute.
window.Pages = window.Pages || {};
const R = Model.rnd, g = Model.g, f0 = x => (+x).toFixed(0), f1 = x => (+x).toFixed(1), f2 = x => (+x).toFixed(2), f3 = x => (+x).toFixed(3);
const rel = (a, p = 0.02) => Math.max(Math.abs(a) * p, 1e-9);

const GEN = {
  latlt: { name: 'Lateral load transfer', fn() {
    const m = R(700, 850, 10), a = R(1.5, 4.5, 0.5), h = R(0.24, 0.34, 0.01), t = R(1.45, 1.65, 0.05), A = m * a * g * h / t / 1000;
    return { q: `Mass <b>${m} kg</b>, lateral acceleration <b>${f1(a)} g</b>, CoG height <b>${f2(h)} m</b>, track width <b>${f2(t)} m</b>. Total lateral load transfer in kN?`, ans: A, tol: rel(A), unit: 'kN',
      sol: `ΔF<sub>z</sub> = m·a<sub>y</sub>·h ÷ t = ${m} × ${f1(a)} × 9.81 × ${f2(h)} ÷ ${f2(t)} = <b>${f2(A)} kN</b>.` };
  } },
  lonlt: { name: 'Longitudinal load transfer', fn() {
    const m = R(700, 850, 10), a = R(2, 5.5, 0.5), h = R(0.24, 0.34, 0.01), L = R(3.2, 3.6, 0.05), A = m * a * g * h / L / 1000;
    return { q: `Braking at <b>${f1(a)} g</b> with mass <b>${m} kg</b>, CoG height <b>${f2(h)} m</b> and wheelbase <b>${f2(L)} m</b>. How much load moves to the front axle, in kN?`, ans: A, tol: rel(A), unit: 'kN',
      sol: `ΔF<sub>z</sub> = m·a<sub>x</sub>·h ÷ L = ${m} × ${f1(a)} × 9.81 × ${f2(h)} ÷ ${f2(L)} = <b>${f2(A)} kN</b>.` };
  } },
  downforce: { name: 'Downforce', fn() {
    const v = R(150, 320, 10), c = R(3, 5.5, 0.1), V = v / 3.6, A = 0.5 * 1.2 * V * V * c / 1000;
    return { q: `C<sub>L</sub>A = <b>${f1(c)} m²</b>, speed <b>${v} km/h</b>, ρ = 1.2 kg/m³. Downforce in kN?`, ans: A, tol: rel(A), unit: 'kN',
      sol: `V = ${v} ÷ 3.6 = ${f2(V)} m/s. Downforce = ½ × 1.2 × ${f2(V)}² × ${f1(c)} = <b>${f2(A)} kN</b>.` };
  } },
  dragpower: { name: 'Drag power', fn() {
    const v = R(200, 340, 10), c = R(0.8, 1.6, 0.1), V = v / 3.6, A = 0.5 * 1.2 * c * V ** 3 / 1000;
    return { q: `C<sub>D</sub>A = <b>${f1(c)} m²</b> at <b>${v} km/h</b>, ρ = 1.2 kg/m³. Power needed to overcome drag, in kW?`, ans: A, tol: rel(A), unit: 'kW',
      sol: `P = ½ρC<sub>D</sub>A·V³ = 0.5 × 1.2 × ${f1(c)} × ${f2(V)}³ = <b>${f0(A)} kW</b>. Speed cubed is why top speed is so expensive.` };
  } },
  corner: { name: 'Cornering speed (no aero)', fn() {
    const r = R(20, 150, 5), a = R(1.5, 3, 0.1), V = Math.sqrt(a * g * r), A = V * 3.6;
    return { q: `A corner of radius <b>${r} m</b>; the car can sustain <b>${f1(a)} g</b> laterally. Maximum speed in km/h?`, ans: A, tol: rel(A), unit: 'km/h',
      sol: `a = V² ÷ r, so V = √(a·r) = √(${f1(a)} × 9.81 × ${r}) = ${f2(V)} m/s = <b>${f1(A)} km/h</b>.` };
  } },
  aerocorner: { name: 'Cornering speed with downforce', fn() {
    let r, mu, m, c, k; do { r = R(40, 120, 10); mu = R(1.4, 1.9, 0.1); m = R(750, 850, 50); c = R(3, 5, 0.5); k = 0.5 * 1.2 * c; } while (m / r - mu * k < 1.5);
    const V = Math.sqrt(mu * m * g / (m / r - mu * k)), A = V * 3.6;
    return { q: `Radius <b>${r} m</b>, µ = <b>${f1(mu)}</b>, mass <b>${m} kg</b>, C<sub>L</sub>A = <b>${f1(c)} m²</b>, ρ = 1.2. Maximum cornering speed in km/h? (point mass)`, ans: A, tol: rel(A), unit: 'km/h',
      sol: `m V² ÷ r = µ(mg + ½ρC<sub>L</sub>A V²) gives V² = µmg ÷ (m ÷ r − µ·½ρC<sub>L</sub>A) = ${f0(mu * m * g)} ÷ (${f2(m / r)} − ${f2(mu * k)}) = ${f0(V * V)}. V = ${f2(V)} m/s = <b>${f1(A)} km/h</b>.` };
  } },
  brakedist: { name: 'Braking distance', fn() {
    const v1 = R(250, 330, 10), v2 = R(70, 150, 10), a = R(3.5, 5, 0.5), A = ((v1 / 3.6) ** 2 - (v2 / 3.6) ** 2) / (2 * a * g);
    return { q: `Braking from <b>${v1}</b> to <b>${v2} km/h</b> at an average <b>${f1(a)} g</b>. Distance in metres?`, ans: A, tol: rel(A), unit: 'm',
      sol: `s = (V₁² − V₂²) ÷ (2a) = (${f2(v1 / 3.6)}² − ${f2(v2 / 3.6)}²) ÷ (2 × ${f1(a)} × 9.81) = <b>${f1(A)} m</b>.` };
  } },
  straight: { name: 'Time along a straight', fn() {
    const s = R(300, 700, 50), v0 = R(90, 160, 10), a = R(0.8, 1.4, 0.1), V0 = v0 / 3.6, V = Math.sqrt(V0 * V0 + 2 * a * g * s), A = (V - V0) / (a * g);
    return { q: `A <b>${s} m</b> straight entered at <b>${v0} km/h</b> with a constant <b>${f1(a)} g</b> of acceleration. Time to the end, in seconds?`, ans: A, tol: rel(A, 0.01), unit: 's',
      sol: `V<sub>end</sub> = √(${f2(V0)}² + 2 × ${f1(a)} × 9.81 × ${s}) = ${f2(V)} m/s. t = (V<sub>end</sub> − V₀) ÷ a = (${f2(V)} − ${f2(V0)}) ÷ ${f2(a * g)} = <b>${f3(A)} s</b>.` };
  } },
  wheelrate: { name: 'Wheel rate', fn() {
    const k = R(100, 300, 10), mr = R(0.4, 1.0, 0.05), A = k * mr * mr;
    return { q: `Spring <b>${k} N/mm</b>, motion ratio <b>${f2(mr)}</b> (spring travel per wheel travel). Wheel rate in N/mm?`, ans: A, tol: rel(A), unit: 'N/mm',
      sol: `k<sub>w</sub> = k × MR² = ${k} × ${f2(mr)}² = <b>${f1(A)} N/mm</b>.` };
  } },
  freq: { name: 'Ride frequency', fn() {
    const kw = R(40, 200, 10), m = R(150, 250, 10), A = Math.sqrt(kw * 1000 / m) / (2 * Math.PI);
    return { q: `Wheel rate <b>${kw} N/mm</b>, sprung mass on that corner <b>${m} kg</b>. Natural frequency in Hz?`, ans: A, tol: rel(A), unit: 'Hz',
      sol: `f = (1 ÷ 2π)√(k ÷ m) = (1 ÷ 2π)√(${kw * 1000} ÷ ${m}) = <b>${f2(A)} Hz</b>. Remember N/mm × 1000 = N/m.` };
  } },
  damping: { name: 'Damping ratio', fn() {
    const c = R(2000, 8000, 250), k = R(50, 200, 10), m = R(150, 250, 10), A = c / (2 * Math.sqrt(k * 1000 * m));
    return { q: `Damping <b>${c} N·s/m</b>, wheel rate <b>${k} kN/m</b>, sprung corner mass <b>${m} kg</b>. Damping ratio ζ?`, ans: A, tol: rel(A), unit: '',
      sol: `ζ = c ÷ (2√(km)) = ${c} ÷ (2 × √(${k * 1000} × ${m})) = <b>${f2(A)}</b>.` };
  } },
  massscale: { name: 'Mass sensitivity', fn() {
    const dt = R(0.2, 0.4, 0.01), dm = R(2, 15, 1), A = dt / 10 * dm;
    return { q: `Simulation says <b>10 kg</b> costs <b>${f2(dt)} s</b> per lap. What does <b>${dm} kg</b> cost? (assume linear)`, ans: A, tol: 0.006, unit: 's',
      sol: `${f2(dt)} ÷ 10 × ${dm} = <b>${f3(A)} s</b> per lap. Linear sensitivities hold for small changes only.` };
  } },
  fuel: { name: 'Fuel effect', fn() {
    const e = R(0.025, 0.035, 0.005), b = R(1.4, 1.9, 0.1), n = R(10, 30, 5), A = e * b * n;
    return { q: `Given a fuel effect of <b>${f3(e)} s per kg</b> per lap and a burn of <b>${f1(b)} kg per lap</b>, how much faster is the car after <b>${n}</b> laps, from fuel alone?`, ans: A, tol: rel(A), unit: 's',
      sol: `Mass lost = ${f1(b)} × ${n} = ${f1(b * n)} kg; gain = ${f3(e)} × ${f1(b * n)} = <b>${f2(A)} s</b> per lap.` };
  } },
  ci: { name: 'Confidence interval', fn() {
    const n = R(4, 16, 1), s = R(0.05, 0.2, 0.01), A = 1.96 * s / Math.sqrt(n);
    return { q: `<b>${n}</b> laps with a standard deviation of <b>${f2(s)} s</b>. Using 1.96 × standard error, what is the half-width of the 95% interval on the mean?`, ans: A, tol: rel(A), unit: 's',
      sol: `SE = ${f2(s)} ÷ √${n} = ${f3(s / Math.sqrt(n))} s. Half-width = 1.96 × SE = <b>${f3(A)} s</b>. For small n, a t-value gives a slightly wider interval.` };
  } },
  laps: { name: 'Laps needed', fn() {
    const s = R(0.06, 0.2, 0.01), E = R(0.02, 0.06, 0.01), A = Math.ceil((1.96 * s / E) ** 2);
    return { q: `Lap-to-lap spread σ = <b>${f2(s)} s</b>. How many laps to know the mean within <b>±${f2(E)} s</b> at 95% confidence? (round up)`, ans: A, tol: 0.5, unit: 'laps',
      sol: `n = (1.96σ ÷ E)² = (1.96 × ${f2(s)} ÷ ${f2(E)})² = ${f1((1.96 * s / E) ** 2)}, so <b>${A} laps</b>.` };
  } },
  errprop: { name: 'Error propagation', fn() {
    const c = R(1, 4, 0.5), v = R(0.5, 2, 0.5), A = Math.sqrt(c * c + (2 * v) ** 2);
    return { q: `Downforce = ½ρV²C<sub>L</sub>A. C<sub>L</sub>A is uncertain by <b>±${f1(c)}%</b> and speed by <b>±${f1(v)}%</b>, independently. Percentage uncertainty in downforce?`, ans: A, tol: rel(A), unit: '%',
      sol: `The V² term contributes 2 × ${f1(v)} = ${f1(2 * v)}%. Combined: √(${f1(c)}² + ${f1(2 * v)}²) = <b>${f2(A)}%</b>.` };
  } },
  units: { name: 'Unit conversion', fn() {
    const t = Model.pick([0, 1, 2]);
    if (t === 0) { const v = R(60, 340, 10), A = v / 3.6; return { q: `<b>${v} km/h</b> in m/s?`, ans: A, tol: 0.06, unit: 'm/s', sol: `${v} ÷ 3.6 = <b>${f2(A)} m/s</b>.` }; }
    if (t === 1) { const k = R(50, 400, 10); return { q: `<b>${k} N/mm</b> in kN/m?`, ans: k, tol: 0.5, unit: 'kN/m', sol: `1 N/mm = 1,000 N/m = 1 kN/m, so <b>${k} kN/m</b>.` }; }
    const a = R(1.5, 6, 0.5), A = a * g; return { q: `<b>${f1(a)} g</b> in m/s²?`, ans: A, tol: 0.06, unit: 'm/s²', sol: `${f1(a)} × 9.81 = <b>${f2(A)} m/s²</b>.` };
  } },
  factorial: { name: 'Design of experiments', fn() {
    const k = R(2, 6, 1), l = R(2, 3, 1), A = l ** k;
    return { q: `A full factorial test of <b>${k}</b> parameters at <b>${l}</b> levels each. How many runs?`, ans: A, tol: 0.5, unit: 'runs', sol: `Levels<sup>factors</sup> = ${l}<sup>${k}</sup> = <b>${A} runs</b>.` };
  } },
  lag: { name: 'Filter delay', fn() {
    const N = Model.pick([5, 7, 9, 11, 15, 21]), fs = Model.pick([50, 100, 200, 500]), v = R(150, 320, 10), A = (N - 1) / 2 / fs * v / 3.6;
    return { q: `A <b>${N}</b>-sample moving average on a <b>${fs} Hz</b> channel. At <b>${v} km/h</b>, how many metres does the delay shift an event?`, ans: A, tol: rel(A, 0.03), unit: 'm',
      sol: `Delay = (N − 1) ÷ 2 = ${(N - 1) / 2} samples = ${f3((N - 1) / 2 / fs)} s. Distance = ${f3((N - 1) / 2 / fs)} × ${f2(v / 3.6)} = <b>${f2(A)} m</b>.` };
  } }
};

function parseNum(s) {
  s = String(s).trim().replace(/[−–]/g, '-').replace(',', '.').replace(/[^0-9.\-+eE]/g, '');
  const v = parseFloat(s); return isNaN(v) ? null : v;
}

Pages['drills'] = {

  render(el) {
    let topic = 'mixed', cur = null, key = null; const session = { n: 0, ok: 0 };
    el.innerHTML = `<div class="crumb">Practise</div><h1>Drills</h1>

    <div class="score" style="margin-top:10px"><span>This session: <b id="sc">0 / 0</b></span></div></div>

      <div><button class="btn" id="check">Check</button><button class="btn ghost" id="next">Next question</button></div><div id="fb"></div></div>`;

      fb.innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}"><b class="${ok ? 'verdict-good' : 'verdict-bad'}">${ok ? 'Correct.' : 'Not quite.'}</b> ${cur.sol}</div>`;

    }
    el.querySelector('#topic').onchange = e => { topic = e.target.value; next(); };
    el.querySelector('#check').onclick = check; el.querySelector('#next').onclick = next;
    ans.addEventListener('keydown', e => { if (e.key === 'Enter') { el.querySelector('#check').disabled ? next() : check(); } });
    next();
  }
};

const SPRINT_GEN = [
  () => { const v = 36 * R(2, 9, 1); return { q: `${v} km/h = ? m/s`, a: v / 3.6 }; },
  () => { const v = R(10, 90, 10), r = R(10, 100, 10); return { q: `V = ${v} m/s, r = ${r} m. V² ÷ r = ? m/s²`, a: v * v / r }; },

  () => { const d = R(1, 9, 1), n = R(10, 30, 10); return { q: `${d} ms/kg × ${n} kg = ? s (answer in seconds)`, a: d * n / 1000 }; },
  () => { const f = Model.pick([2, 3, 4]); return { q: `Speed × ${f}: downforce × ?`, a: f * f }; },

Pages['sprint'] = {
  group: 'Practise', title: '60-second sprint', blurb: 'Quick sums without a calculator',
  render(el) {
    let timerId = null;
    el.innerHTML = `<div class="crumb">Practise</div><h1>60-second sprint</h1>
    <p class="lead">As many as you can in 60 seconds, without a calculator. It builds the speed you need for timed numerical and technical tests.</p>
    <div class="score"><span>Best: <b>${Store.get('sprintBest', 0)}</b></span></div><div class="panel" id="box"><button class="btn" id="go">Start</button></div>`;
    const box = el.querySelector('#box'); box.querySelector('#go').onclick = start;
    function start() {
      let left = 60, score = 0, cur; const missed = [];
      box.innerHTML = `<div class="timer" id="tm"><div style="width:100%"></div></div><div class="score"><span>Time: <b id="t">60</b> s</span><span>Score: <b id="s">0</b></span></div>
        <p class="big" id="q" style="font-size:1.6rem;margin:18px 0"></p><input type="text" id="a" inputmode="decimal" autocomplete="off" aria-label="Answer"><div class="stint-label">Press Enter to submit. Answers within 1% count.</div>`;
      const qEl = box.querySelector('#q'), a = box.querySelector('#a');
      const next = () => { cur = Model.pick(SPRINT_GEN)(); qEl.textContent = cur.q; a.value = ''; a.focus(); };
      a.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return; const v = parseNum(a.value); if (v === null) return;
        if (Math.abs(v - cur.a) <= Math.max(0.011, Math.abs(cur.a) * 0.01)) { score++; box.querySelector('#s').textContent = score; } else missed.push(`${cur.q} → ${+cur.a.toFixed(3)}`);
        next();
      });
      next();
      timerId = setInterval(() => {
        left -= 0.25; box.querySelector('#tm>div').style.width = (left / 60 * 100) + '%'; box.querySelector('#t').textContent = Math.ceil(left);
        if (left <= 10) box.querySelector('#tm').classList.add('low');
        if (left <= 0) {
          clearInterval(timerId); Store.set('sprintBest', Math.max(Store.get('sprintBest', 0), score)); Store.tally('sprint', true);
          box.innerHTML = `<p class="big">${score}</p><p>correct in 60 seconds.</p>${missed.length ? `<h3>Missed</h3><ul>${missed.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}<button class="btn" id="go">Go again</button>`;
          box.querySelector('#go').onclick = start;
        }
      }, 250);
    }
    App.onLeave(() => clearInterval(timerId));
  }
};

function downloadCSV(name, rows) {
  const keys = Object.keys(rows[0]), csv = [keys.join(',')].concat(rows.map(r => keys.map(k => r[k]).join(','))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
// time at a distance by linear interpolation
const interpT = (sim, x) => { const i = Math.min(sim.x.length - 2, Math.floor(x / (sim.x[1] - sim.x[0]))); return sim.t[i]; };

const VARIANTS = [
  { label: 'More downforce and drag (higher wing)', car: Model.wingCar(5.0), hint: 'faster through the fast corners, slower at the end of the straights' },
  { label: 'Less drag (lower wing)', car: Model.wingCar(3.2), hint: 'higher top speed, slower in fast corners' },
  { label: 'More power', car: { P: 800 }, hint: 'gains on corner exits and straights, identical apex speeds' },

Pages['datalab/spot'] = { group: 'Data lab', title: 'Spot the problem', blurb: 'Find planted faults in data',
  render(el) {
    const base = Model.lapSim({}, 'balanced'), N = 1400, start = 0;
    const draw = () => {
      const f = Model.pick(FAULTS), step = 4, xs = [], gps = [], ws = [];
      for (let i = start; i < start + N; i += step) {
        const v = base.v[i] * 3.6, ax = base.ax[i]; let w = v + 0.6 * Model.randn(), gv = v;
        const x = base.x[i];
        if (f.k === 'lock' && ax < -2 && x > 620 && x < 720) w = v * 0.55;
        if (f.k === 'spin' && ax > 0.4 && x > 760 && x < 900) w = v * 1.12;
        if (f.k === 'drop' && x > 300 && x < 420) w = 0;
        if (f.k === 'units') w = v * 0.6214;
        if (f.k === 'lift' && x > 1050 && x < 1200) { const d = 1 - 0.12 * Math.sin((x - 1050) / 150 * Math.PI); gv = v * d; w = gv; }
        if (f.k === 'spike' && Math.random() < 0.025) w = v + (Math.random() < 0.5 ? -1 : 1) * 120;

Pages['datalab/significance'] = { group: 'Data lab', title: 'Is it significant?', blurb: 'Real gain or noise?',
  render(el) {
    const draw = () => {
      const n1 = Model.rnd(4, 10, 1), n2 = Model.rnd(4, 10, 1), s = Model.rnd(0.06, 0.18, 0.01), true_d = Model.pick([0, 0, -0.05, -0.1, -0.15, 0.08]), base = 91 + Math.random();
      const A = Array.from({ length: n1 }, () => base + s * Model.randn()), B = Array.from({ length: n2 }, () => base + true_d + s * Model.randn());
      const mA = Model.mean(A), mB = Model.mean(B), se = Math.sqrt(Model.sd(A) ** 2 / n1 + Model.sd(B) ** 2 / n2), tval = (mB - mA) / se;
      const verdict = tval < -2 ? 'gain' : tval > 2 ? 'loss' : 'noise';
      el.innerHTML = `<div class="crumb">Data lab</div><h1>Is it significant?</h1>
      <p class="lead">Fuel-corrected laps before (A) and after (B) a setup change, same tyres and conditions. Is the change a real gain, a real loss, or not distinguishable from noise?</p>
      <div class="panel"><table><tr><th>Run</th><th>Laps (s)</th><th class="num">Mean</th><th class="num">SD</th></tr>
      <tr><td>A</td><td>${A.map(x => x.toFixed(3)).join(', ')}</td><td class="num">${mA.toFixed(3)}</td><td class="num">${Model.sd(A).toFixed(3)}</td></tr>
      <tr><td>B</td><td>${B.map(x => x.toFixed(3)).join(', ')}</td><td class="num">${mB.toFixed(3)}</td><td class="num">${Model.sd(B).toFixed(3)}</td></tr></table>
      <div class="choices"><button class="choice" data-v="gain">B is a real gain</button><button class="choice" data-v="noise">Cannot tell: within the noise</button><button class="choice" data-v="loss">B is a real loss</button></div><div id="fb"></div>
      <button class="btn ghost" id="new">New data</button></div>
      <div class="note">Method: difference of means divided by its standard error, √(s<sub>A</sub>²/n<sub>A</sub> + s<sub>B</sub>²/n<sub>B</sub>). Beyond about ±2 is unlikely to be noise (about 95% confidence; small samples need a slightly larger threshold from the t-distribution).</div>`;
      el.querySelectorAll('.choice').forEach(btn => btn.onclick = () => {
        const ok = btn.dataset.v === verdict; Store.tally('significance', ok);
        el.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (x.dataset.v === verdict) x.classList.add('right'); else if (x === btn) x.classList.add('wrong'); });
        el.querySelector('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}"><b class="${ok ? 'verdict-good' : 'verdict-bad'}">${ok ? 'Correct.' : 'Not quite.'}</b> Difference = ${(mB - mA).toFixed(3)} s, standard error = ${se.toFixed(3)} s, ratio = ${tval.toFixed(2)}. ${verdict === 'noise' ? 'Too close to call: run more laps.' : verdict === 'gain' ? 'B is faster beyond the noise.' : 'B is slower beyond the noise.'} (The true effect in this generated data was ${true_d === 0 ? 'zero' : Model.sgn(true_d, 2) + ' s'}.)</div>`;
      });
      el.querySelector('#new').onclick = draw;
    };
    draw();
  } };

 { t: 'Write a point-mass lap sim', brief: 'Write a function that takes arrays of distance and radius (0 for straights) and car parameters, and returns speed and lap time using apex limits, a forward pass and a backward pass. Test it on a constant-radius circle against √(µgr).',
   hint: 'Set C_L·A = 0 and C_D·A = 0 for the test: the speed must equal √(µgr). Start the passes from the slowest point and wrap around.',
   sol: `import numpy as np
g = 9.81

def lap_sim(radius, ds, m=800, ClA=4.0, CdA=1.4, P=750e3, mu=1.6, rho=1.2, rear=0.55):
    k, kd = 0.5 * rho * ClA, 0.5 * rho * CdA
    n = len(radius)
    vtop = (P / kd) ** (1 / 3) if kd > 0 else 1000.0
    vlim = np.full(n, vtop)
    for i, r in enumerate(radius):
        if r > 0:
            den = m / r - mu * k
            vlim[i] = min(vtop, np.sqrt(mu * m * g / den)) if den > 0 else vtop

    def long_force(v, r):
        N = m * g + k * v * v
        lat = m * v * v / r if r > 0 else 0.0
        return np.sqrt(max(0.0, (mu * N) ** 2 - lat ** 2))

    i0 = int(np.argmin(vlim))
    vf, vb = vlim.copy(), vlim.copy()
    for s in range(1, n + 1):                      # forward: accelerate
        i, p = (i0 + s) % n, (i0 + s - 1) % n
        F = min(P / max(vf[p], 5.0), rear * long_force(vf[p], radius[p]))
        a = (F - kd * vf[p] ** 2) / m
        vf[i] = min(np.sqrt(max(1.0, vf[p] ** 2 + 2 * a * ds)), vlim[i])
    for s in range(1, n + 1):                      # backward: brake
        i, nx = (i0 - s) % n, (i0 - s + 1) % n
        d = (long_force(vb[nx], radius[nx]) + kd * vb[nx] ** 2) / m
        vb[i] = min(np.sqrt(vb[nx] ** 2 + 2 * d * ds), vlim[i])
    v = np.minimum(vf, vb)
    lap_time = np.sum(2 * ds / (v + np.roll(v, -1)))
    return v, lap_time

# test: a constant-radius circle with no downforce and no drag
r = 50.0
v, t = lap_sim(np.full(314, r), 1.0, ClA=0.0, CdA=0.0)
print(v.min(), np.sqrt(1.6 * g * r))   # should match
# With drag switched back on, the speed is slightly lower: some grip
# is needed longitudinally to overcome drag (the friction circle).` },

 ['"The front won\'t turn in."', 'Entry understeer', 'Steering angle against lateral g at turn-in, front slip, brake release timing, front tyre temperatures.'],
 ['"The rear is nervous on entry."', 'Entry oversteer or instability', 'Yaw rate against steering, rear brake contribution and locking, diff on entry, engine braking and energy recovery.'],
 ['"It\'s pushing mid-corner."', 'Mid-corner understeer', 'Steering against lateral g at the apex, roll stiffness split, aero balance and ride heights at that speed.'],
 ['"I can\'t get on the power."', 'Exit oversteer or poor traction', 'Rear wheel speed against vehicle speed (wheelspin), throttle trace, diff on exit.'],
 ['"The car is floaty at high speed."', 'Low or unstable aero load', 'Ride heights and pitch at speed, downforce estimate, wind direction.'],
 ['"It\'s bouncing on the straight."', 'Porpoising or bottoming', 'Ride height oscillation frequency, plank contact, damper positions.'],
 ['"The tyres have gone off."', 'Degradation or overheating', 'Lap time trend, tyre temperatures, sliding in traction and braking zones.'],
 ['"It\'s snappy."', 'Sudden loss of rear grip', 'Yaw rate spikes, rear slip, sensitivity to kerbs or throttle.'],
 ['"The brakes feel long."', 'Brake feel or temperature', 'Brake pressure against deceleration, brake temperatures, pedal travel.'],
 ['"I\'m locking the fronts."', 'Front lock-up', 'Front wheel speed against vehicle speed under braking, brake balance.'],
 ['"The car feels lazy in the chicane."', 'Slow transient response', 'Yaw rate response to steering, damping, roll stiffness.'],
 ['"No grip on the out-lap."', 'Tyres below temperature', 'Tyre temperatures and pressures, warm-up strategy.']
];
Pages['glossary'] = { group: 'Practise', title: 'Driver-phrase glossary', blurb: 'From comments to data questions',
  render(el) {
    const draw = () => {
      const p = Model.pick(PHRASES), opts = Model.shuffle([p, ...Model.shuffle(PHRASES.filter(x => x !== p)).slice(0, 3)]);
      el.innerHTML = `<div class="crumb">Practise</div><h1>Driver-phrase glossary</h1>
      <p class="lead">Drivers describe the car in their own words. Vehicle performance turns those words into a data question. Practise matching them, then read the full list.</p>
      <div class="panel"><div class="radio">${p[0]}</div><b>What is the driver most likely describing?</b><div class="choices">${opts.map(o => `<button class="choice" data-k="${o[1]}">${o[1]}</button>`).join('')}</div><div id="fb"></div><button class="btn ghost" id="new">Another</button></div>
      <div class="panel"><table><tr><th>Driver says</th><th>Likely meaning</th><th>Data to check</th></tr>${PHRASES.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div>`;
      el.querySelectorAll('.choice').forEach(b => b.onclick = () => {
        const ok = b.dataset.k === p[1]; Store.tally('glossary', ok);
        el.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (x.dataset.k === p[1]) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
        el.querySelector('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}"><b>${p[1]}.</b> Check: ${p[2]}</div>`;
      });
      el.querySelector('#new').onclick = draw;
    };
    draw();
  } };

Pages['sources'] = { group: 'Start', title: 'Sources', blurb: 'Textbooks, papers and regulations',
  render(el) {
    const groups = [['Vehicle dynamics and tyres', ['MIL', 'GIL', 'PAC', 'SMITH']], ['Aerodynamics', ['KATZ']], ['Lap time simulation and optimal control', ['SIE', 'LIM', 'PER']],
      ['Data, testing and rigs', ['SEG', 'KOW']], ['Numerical methods, signals, statistics', ['BUR', 'OPP', 'MON', 'TAY', 'ICAO']], ['Regulations (primary FIA documents)', ['FIAC', 'FIAB', 'FIAPR', 'FIAREF', 'FIADSQ']], ['The role', ['ADVERT']]];
    el.innerHTML = `<div class="crumb">Start</div><h1>Sources</h1>
    <p class="lead">Engineering content is based on standard textbooks and papers by practising engineers and researchers; regulation facts come from the FIA's own documents. Worked-example numbers and the lap sim's car are illustrative, not any team's data.</p>
    ${groups.map(([t, ks]) => `<div class="panel"><h3 style="margin-top:0">${t}</h3><ul>${ks.map(k => `<li>${REF[k]}</li>`).join('')}</ul></div>`).join('')}
    <div class="note">Regulations are revised during a season. Before quoting a rule in an interview, check the latest issue on the FIA website.</div>`;
  } };

</script>
<script>
// Router, navigation, home and progress pages.
const App = (() => {
  const main = document.getElementById('main'), nav = document.getElementById('nav');
  let leaveFns = [];
  const GROUPS = [
    ['Start', ['', 'progress', 'sources']],
    ['Learn', LEARN.map(t => 'learn/' + t.id)],
    ['Tools', ['tools/lapsim', 'tools/sweep', 'tools/sensitivity', 'tools/loadtransfer', 'tools/tyre', 'tools/aero', 'tools/ride', 'tools/filter']],
    ['Practise', ['drills', 'sprint', 'calls', 'cards', 'formulas', 'glossary']],
    ['Data lab', ['datalab/telemetry', 'datalab/spot', 'datalab/significance', 'datalab/python', 'datalab/cheatsheet', 'datalab/report']],
    ['Assessment', ['assess/mocktest', 'assess/takehome', 'assess/case', 'assess/tips', 'assess/daybefore', 'assess/team']],
    ['Interview', ['interview/screening', 'interview/technical', 'interview/estimation', 'interview/projects', 'interview/behavioural', 'interview/mock', 'interview/ask']]
  ];
  Pages[''] = { title: 'Home', render: home };
  Pages['progress'] = { title: 'Progress', render: progress };

  function renderNav() {
    const cur = location.hash.replace(/^#\/?/, '');
    nav.innerHTML = GROUPS.map(([gname, keys]) => `<h4>${gname}</h4>` + keys.map(k => {
      const p = Pages[k]; const done = p.done && p.done() ? '<span class="done">✓</span>' : '';
      return `<a href="#/${k}"${k === cur ? ' aria-current="page"' : ''}>${p.title}${done}</a>`;
    }).join('')).join('');
  }
  function route() {
    leaveFns.forEach(f => { try { f(); } catch (e) { } }); leaveFns = [];
    const key = location.hash.replace(/^#\/?/, ''), page = Pages[key] || Pages[''];
    document.title = (page.title === 'Home' ? '' : page.title + ' · ') + 'Apex: Vehicle Performance Prep';
    main.innerHTML = ''; page.render(main); renderNav();
    nav.classList.remove('open'); document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
    window.scrollTo(0, 0); main.focus({ preventScroll: true });
  }

  function home(el) {
    el.innerHTML = `
    <section class="hero">
      <div><h1>Find the lap time.</h1>
        <p class="lead">Revision and practice for F1 vehicle performance and vehicle dynamics placement interviews and assessments: the physics, lap simulation, setup, data analysis in Python, and interview practice.</p>
        <a class="btn" href="#/learn/role" style="text-decoration:none;display:inline-block">Start learning</a>
        <a class="btn ghost" href="#/tools/lapsim" style="text-decoration:none;display:inline-block">Open the lap sim</a></div>
      <div class="call" aria-label="Example question">
        <div class="sit">Setup sweep result, balanced circuit</div>
        <div class="radio">One more wing click: +0.08 s on the straights, −0.12 s in the corners. What do you recommend?</div>
        <div class="choices"><button class="choice" data-i="0">Add the wing: net −0.04 s, but flag the lower top speed</button><button class="choice" data-i="1">Don't add it: straights matter more</button><button class="choice" data-i="2">Add it: 0.12 s faster</button></div>
        <div id="hfb"></div></div>
    </section>
    <h2>Three-week study plan</h2>
    <table><tr><th>Week</th><th>Focus</th><th>Each day (about an hour)</th></tr>
    <tr><td>1: Foundations</td><td>Learn 1 to 8, formula sheet</td><td>One Learn page, its drills to 80%, 10 flashcards, one "say it in 30 seconds" out loud</td></tr>
    <tr><td>2: Simulation and data</td><td>Learn 9 to 21; lap sim, sweep and sensitivity tools; Python tasks 1 to 5</td><td>One topic, one tool session, one coding task, 10 flashcards</td></tr>
    <tr><td>3: Under pressure</td><td>Mock technical test, engineering calls, interview banks, case brief, Python tasks 6 to 8</td><td>One mock test or case, five calls, a 20-minute mock interview, sprint, flashcards</td></tr></table>
    <p>The day before: the <a href="#/assess/daybefore">day-before checklist</a>, the <a href="#/formulas">formula sheet</a>, three project stories out loud. Then stop.</p>
    ${GROUPS.slice(1).map(([gname, keys]) => `<h2>${gname}</h2><div class="grid">${keys.map(k => `<a class="tile" href="#/${k}"><strong>${Pages[k].title}</strong><span>${Pages[k].blurb || ''}</span></a>`).join('')}</div>`).join('')}
    <p class="stint-label" style="margin-top:40px">Engineering content is based on standard textbooks and papers, and regulation facts on FIA documents (see <a href="#/sources">Sources</a>). Numbers in examples and tools are illustrative. An independent revision resource, not affiliated with Formula 1, the FIA or any team. Progress is saved only in this browser.</p>`;
    el.querySelectorAll('.call .choice').forEach(b => b.onclick = () => {
      const ok = +b.dataset.i === 0; el.querySelectorAll('.call .choice').forEach(x => { x.disabled = true; if (+x.dataset.i === 0) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
      el.querySelector('#hfb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}"><b class="${ok ? 'verdict-good' : 'verdict-bad'}">${ok ? 'Good call.' : 'Not the best call.'}</b> Net = +0.08 − 0.12 = −0.04 s per lap, so the wing is faster. Report where the time comes from, and flag the cost in top speed for overtaking and defending. <a href="#/learn/sweeps">More on sweeps</a></div>`;
    });
  }

  const pct = t => (t && t.attempts ? Math.round(100 * t.correct / t.attempts) : null);
  function progress(el) {
    const learnDone = LEARN.filter(t => Store.get('learn.' + t.id, false)).length;
    const rows = Object.entries(GEN).map(([k, gn]) => { const t = Store.get('tally.drill.' + k, null); return `<tr><td>${gn.name}</td><td class="num">${t ? t.attempts : 0}</td><td class="num">${pct(t) === null ? '–' : pct(t) + '%'}</td></tr>`; }).join('');
    const tl = k => { const t = Store.get('tally.' + k, null); return t ? `${t.correct} of ${t.attempts} (${pct(t)}%)` : 'none yet'; };
    const boxes = [0, 0, 0, 0, 0]; CARDS.forEach((_, i) => boxes[Store.get('cards.' + i, 1) - 1]++);
    el.innerHTML = `<div class="crumb">Start</div><h1>Progress</h1><p class="lead">Saved in this browser only. Your weakest drill topics are where to spend your next session.</p>
    <div class="panel"><h3 style="margin-top:0">Learn</h3><p>${learnDone} of ${LEARN.length} topics marked as revised</p><div class="bar"><div style="width:${100 * learnDone / LEARN.length}%"></div></div></div>
    <div class="panel"><h3 style="margin-top:0">Drills</h3><table><tr><th>Topic</th><th class="num">Attempts</th><th class="num">Accuracy</th></tr>${rows}</table></div>
    <div class="panel"><h3 style="margin-top:0">Practice and assessment</h3><dl class="kv">
      <dt>Engineering calls (best answer)</dt><dd>${tl('calls')}</dd><dt>Best calls round</dt><dd>${Store.get('callsBest', 0)} of ${CALLS.length * 2} points</dd>
      <dt>Mock technical test best</dt><dd>${Store.get('mockBest', 0)} / 12</dd><dt>Sprint best</dt><dd>${Store.get('sprintBest', 0)} in 60 s</dd>
      <dt>Telemetry viewer</dt><dd>${tl('telemetry')}</dd><dt>Spot the problem</dt><dd>${tl('spot')}</dd><dt>Is it significant?</dt><dd>${tl('significance')}</dd>
      <dt>Driver phrases</dt><dd>${tl('glossary')}</dd><dt>Mock interview answers rated okay or strong</dt><dd>${tl('mock')}</dd></dl></div>
    <div class="panel"><h3 style="margin-top:0">Flashcards</h3><div class="boxes">${boxes.map((n, i) => `<span>Box ${i + 1}: <b>${n}</b></span>`).join('')}</div></div>
    <button class="btn ghost" id="reset">Reset all progress</button>`;
    let armed = false;
    el.querySelector('#reset').onclick = e => { if (!armed) { armed = true; e.target.textContent = 'Click again to confirm reset'; return; } Store.reset(); progress(el); renderNav(); };
  }

  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
    const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; themeBtn.textContent = dark ? 'Light' : 'Dark';
  }
  applyTheme(Store.get('theme', null));
  themeBtn.onclick = () => { const t = themeBtn.textContent === 'Dark' ? 'dark' : 'light'; Store.set('theme', t); applyTheme(t); };
  document.getElementById('menuBtn').onclick = e => { const open = nav.classList.toggle('open'); e.target.setAttribute('aria-expanded', open); };
  window.addEventListener('hashchange', route);
  return { renderNav, onLeave: f => leaveFns.push(f), start: route };
})();
App.start();

</script>
</body>
</html>
