<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex: Vehicle Performance Prep</title>
<meta name="description" content="Revision and practice for F1 vehicle performance placement interviews and assessments: vehicle dynamics, lap simulation, setup, data analysis and interview practice.">

<style>
:root{
  --paper:#F6F7F9; --sheet:#FFFFFF; --ink:#141820; --muted:#5E6672; --rule:#D9DEE5; --rule-strong:#B9C1CC;
  --accent:#1C3D6E; --accent-ink:#FFFFFF; --good:#1E7A47; --bad:#B42330; --warn:#9A6400;
  --soft:#C8102E; --medium:#E8B10F; --hard:#C9CED6; --inter:#2E9A52; --wet:#2F72C8;
  --focus:#2F72C8; --radius:6px; --shadow:0 1px 0 rgba(20,24,32,.04);
}
:root[data-theme="dark"]{
  --paper:#0F1218; --sheet:#171B23; --ink:#E8EBF0; --muted:#9AA3AF; --rule:#2A303B; --rule-strong:#3A4250;
  --accent:#8FB4EE; --accent-ink:#0F1218; --good:#4CC27F; --bad:#F06A72; --warn:#E3B04B; --hard:#E8EBF0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1218; --sheet:#171B23; --ink:#E8EBF0; --muted:#9AA3AF; --rule:#2A303B; --rule-strong:#3A4250;
    --accent:#8FB4EE; --accent-ink:#0F1218; --good:#4CC27F; --bad:#F06A72; --warn:#E3B04B; --hard:#E8EBF0;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 "Barlow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:50;background:var(--sheet);padding:8px 12px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;line-height:1.1;margin:0 0 .4em}
h1{font-size:clamp(2.3rem,5vw,3.6rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.75rem;font-weight:700;margin-top:1.6em}
h3{font-size:1.3rem;font-weight:600;margin-top:1.2em}
p{margin:0 0 1em;max-width:72ch}
ul,ol{max-width:72ch;padding-left:1.25em}li{margin:.25em 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}

/* top bar + layout */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.brand{font:700 1.5rem/1 "Barlow Condensed",sans-serif;color:var(--ink);text-decoration:none;display:flex;align-items:baseline;gap:10px}
.brand span{font:500 .95rem "Barlow",sans-serif;color:var(--muted)}
.theme-btn,.menu-btn{margin-left:auto;font:600 .9rem "Barlow",sans-serif;background:none;border:1px solid var(--rule-strong);color:var(--ink);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
.menu-btn{display:none;margin-left:0}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 54px)}
.nav{border-right:1px solid var(--rule);background:var(--sheet);padding:18px 14px 40px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.nav h4{font:600 .82rem "Barlow",sans-serif;color:var(--muted);margin:18px 8px 6px}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius);color:var(--ink);text-decoration:none;font-size:.98rem}
.nav a:hover{background:var(--paper)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav .done{margin-left:auto;font-size:.8rem;color:var(--good)}
.nav a[aria-current="page"] .done{color:var(--paper)}
.main{padding:32px clamp(16px,4vw,56px) 80px;max-width:1080px;width:100%;min-width:0}
.main:focus{outline:none}
.lead{font-size:1.15rem;color:var(--muted);max-width:62ch}
.crumb{font-size:.92rem;color:var(--muted);margin-bottom:6px}

/* cards & panels */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{display:block;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;color:var(--ink);text-decoration:none}
.tile:hover{border-color:var(--ink)}
.tile strong{display:block;font:600 1.25rem "Barlow Condensed",sans-serif;margin-bottom:2px}
.tile span{color:var(--muted);font-size:.95rem}
.note{border-left:4px solid var(--accent);background:var(--sheet);padding:12px 16px;margin:16px 0;border-radius:0 var(--radius) var(--radius) 0}
.note.warn{border-color:var(--warn)}
.formula{font:500 1.1rem "Barlow",sans-serif;background:var(--sheet);border:1px dashed var(--rule-strong);border-radius:var(--radius);padding:10px 14px;margin:12px 0;max-width:72ch}
.worked{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;margin:14px 0}
.worked b:first-child{font-family:"Barlow Condensed",sans-serif;font-size:1.1rem}

/* tyre chips: the compound colour carries meaning */
.tyre{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:50%;border:.22em solid var(--c);font:700 .78em "Barlow Condensed",sans-serif;color:var(--ink);background:var(--sheet);vertical-align:-.25em}
.tyre.S{--c:var(--soft)}.tyre.M{--c:var(--medium)}.tyre.H{--c:var(--hard)}.tyre.I{--c:var(--inter)}.tyre.W{--c:var(--wet)}

/* stint bars */
.stints{display:flex;height:30px;border-radius:4px;overflow:hidden;border:1px solid var(--rule-strong);margin:6px 0 2px}
.stint{display:flex;align-items:center;justify-content:center;font:700 .9rem "Barlow Condensed",sans-serif;color:#141820;min-width:0;white-space:nowrap;overflow:hidden}
.stint.S{background:var(--soft);color:#fff}.stint.M{background:var(--medium)}.stint.H{background:#E9ECEF}.stint.I{background:var(--inter);color:#fff}.stint.W{background:var(--wet);color:#fff}
.stint+.stint{border-left:3px solid var(--ink)}
.stint-label{font-size:.88rem;color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.hero h1 em{font-style:normal;color:var(--soft)}
.call{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:18px}
.call .sit{font-size:.98rem;color:var(--muted);margin-bottom:8px}
.radio{font:600 1.15rem "Barlow Condensed",sans-serif;border-left:4px solid var(--soft);padding-left:10px;margin:8px 0 12px}

/* forms */
label{display:block;font-weight:600;font-size:.95rem;margin:10px 0 4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px}
.slider{display:flex;align-items:center;gap:10px}
.slider input[type=range]{flex:1;accent-color:var(--accent)}
.slider output{min-width:70px;text-align:right;font-weight:600}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule-strong);border-radius:var(--radius);padding:8px 10px;width:100%;max-width:280px}
textarea{max-width:100%;min-height:110px}
.btn{font:600 1rem "Barlow",sans-serif;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:var(--radius);padding:9px 16px;cursor:pointer;margin:6px 8px 6px 0}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
.btn:disabled{opacity:.45;cursor:default}
.choices{display:grid;gap:8px;margin:12px 0}
.choice{text-align:left;font:500 1rem "Barlow",sans-serif;background:var(--paper);color:var(--ink);border:1px solid var(--rule-strong);border-radius:var(--radius);padding:10px 14px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--sheet))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--sheet))}

/* results */
.result{font-size:1.05rem;margin:12px 0}
.big{font:700 2.4rem/1 "Barlow Condensed",sans-serif}
.verdict-good{color:var(--good)}.verdict-bad{color:var(--bad)}.verdict-warn{color:var(--warn)}
.feedback{margin-top:12px;padding:12px 14px;border-radius:var(--radius);background:var(--paper);border:1px solid var(--rule)}
.feedback.ok{border-color:var(--good)}.feedback.no{border-color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:.95rem}
th,td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted)}
td.num,th.num{text-align:right}

/* timer */
.timer{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:10px 0}
.timer>div{height:100%;background:var(--ink);transition:width .25s linear}
.timer.low>div{background:var(--bad)}
.score{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
.score b{color:var(--ink)}

/* charts */
.chart{width:100%;height:auto;display:block;margin:8px 0}
.chart text{font-family:"Barlow",sans-serif;font-size:12px;fill:var(--muted)}
.chart .axis{stroke:var(--rule-strong)}.chart .gridl{stroke:var(--rule)}
.chart .line{fill:none;stroke-width:2.4}
.chart .lbl{fill:var(--ink);font-weight:600}

/* flashcards */
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;font-size:1.15rem}
.flash .back{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.boxes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.boxes span{border:1px solid var(--rule-strong);border-radius:var(--radius);padding:4px 10px;font-size:.9rem}

/* progress bars */
.bar{height:10px;background:var(--rule);border-radius:5px;overflow:hidden;min-width:120px}
.bar>div{height:100%;background:var(--accent)}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-block}
  .nav{display:none;position:fixed;top:54px;left:0;right:0;bottom:0;height:auto;z-index:15;border-right:0}
  .nav.open{display:block}
  .hero{grid-template-columns:1fr}
  body{font-size:16px}
  .brand span{display:none}
  table{display:block;overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
pre.code{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:12px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
details>summary{cursor:pointer}
@media print{.topbar,.nav{display:none}.layout{display:block}.panel{break-inside:avoid}}

<script>
// Progress storage: saved in this browser only. Every access is wrapped so the
// site still works when storage is blocked (private windows, strict settings).
const Store = (() => {
  const KEY = 'apex-v1';
  let mem = {};
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) mem = JSON.parse(raw) || {}; } catch (e) { /* use memory */ }
    return mem;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* memory only */ } }
  load();
  return {
    get(path, fallback) { return path.split('.').reduce((o, k) => (o && k in o ? o[k] : undefined), mem) ?? fallback; },
    set(path, value) {
      const keys = path.split('.'); let o = mem;
      keys.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; });
      o[keys[keys.length - 1]] = value; save();
    },
    // record an attempt in a practice area: {attempts, correct}
    tally(area, correct) {
      const t = this.get('tally.' + area, { attempts: 0, correct: 0 });
      t.attempts += 1; if (correct) t.correct += 1; this.set('tally.' + area, t);
    },
    reset() { mem = {}; save(); },
    all() { return mem; }
  };
})();

</script>
<script>
// Physics core and point-mass lap time simulation. All SI units inside; helpers convert for display.
// Numbers are illustrative: chosen to be the right order of magnitude for a modern F1 car, not any team's data.
const Model = (() => {
  const g = 9.81;
  const kmh = v => v / 3.6, toKmh = v => v * 3.6;

  // ---------- small helpers ----------
  const rnd = (a, b, step = 1) => { const n = Math.round((b - a) / step); return +(a + step * Math.floor(Math.random() * (n + 1))).toFixed(6); };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sgn = (x, d = 1) => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
  const fmtTime = s => { const m = Math.floor(s / 60), r = s - 60 * m; return `${m}:${r.toFixed(3).padStart(6, '0')}`; };

  // ---------- vehicle dynamics formulas ----------
  const latLT = (m, ayG, h, t) => m * ayG * g * h / t;            // N, lateral load transfer across an axle pair
  const lonLT = (m, axG, h, L) => m * axG * g * h / L;            // N, longitudinal load transfer front-rear
  const downforce = (rho, V, ClA) => 0.5 * rho * V * V * ClA;     // N, V in m/s
  const drag = (rho, V, CdA) => 0.5 * rho * V * V * CdA;          // N
  const dragPower = (rho, V, CdA) => drag(rho, V, CdA) * V;       // W
  const cornerSpeedNoAero = (mu, r) => Math.sqrt(mu * g * r);     // m/s
  // corner speed with downforce: m V^2 / r = mu (m g + k V^2), k = 0.5 rho ClA
  const cornerSpeedAero = (mu, r, m, rho, ClA) => { const k = 0.5 * rho * ClA, den = m / r - mu * k; return den <= 0 ? Infinity : Math.sqrt(mu * m * g / den); };
  const wheelRate = (k, MR) => k * MR * MR;                        // MR = spring travel / wheel travel
  const natFreq = (k, m) => Math.sqrt(k / m) / (2 * Math.PI);      // Hz
  const dampRatio = (c, k, m) => c / (2 * Math.sqrt(k * m));
  // Pacejka Magic Formula: y = D sin(C atan(Bx - E(Bx - atan(Bx))))
  const pacejka = (x, B, C, D, E) => D * Math.sin(C * Math.atan(B * x - E * (B * x - Math.atan(B * x))));
  // unit step response of a mass-spring-damper (displacement / final displacement)
  function stepResponse(f, z, tEnd = 1.5, n = 300) {
    const wn = 2 * Math.PI * f, pts = [];
    for (let i = 0; i <= n; i++) {
      const t = tEnd * i / n; let y;
      if (z < 1) { const wd = wn * Math.sqrt(1 - z * z); y = 1 - Math.exp(-z * wn * t) * (Math.cos(wd * t) + z / Math.sqrt(1 - z * z) * Math.sin(wd * t)); }
      else if (Math.abs(z - 1) < 1e-6) y = 1 - Math.exp(-wn * t) * (1 + wn * t);
      else { const s1 = -wn * (z - Math.sqrt(z * z - 1)), s2 = -wn * (z + Math.sqrt(z * z - 1)); y = 1 + (s2 * Math.exp(s1 * t) - s1 * Math.exp(s2 * t)) / (s1 - s2); }
      pts.push({ x: t, y });
    }
    return pts;
  }
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const sd = a => { const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
  const se = a => sd(a) / Math.sqrt(a.length);
  function randn() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  // ---------- tracks: segments [length m, radius m (0 = straight), name] ----------
  const TRACKS = {
    balanced: { name: 'Balanced circuit', segs: [[700, 0], [55, 22, 'T1 hairpin'], [450, 0], [160, 110, 'T2'], [320, 0], [95, 55, 'T3'], [600, 0], [300, 260, 'T4 fast sweep'], [260, 0], [70, 38, 'T5'], [120, 85, 'T6'], [750, 0], [210, 170, 'T7'], [400, 0]] },
    power: { name: 'Power circuit', segs: [[1100, 0], [45, 18, 'T1 chicane'], [700, 0], [180, 140, 'T2'], [900, 0], [50, 20, 'T3 chicane'], [650, 0], [220, 190, 'T4'], [1000, 0]] },
    twisty: { name: 'Twisty circuit', segs: [[650, 0], [40, 15, 'T1 hairpin'], [380, 0], [90, 45, 'T2'], [160, 0], [70, 30, 'T3'], [250, 0], [110, 60, 'T4'], [180, 0], [60, 25, 'T5'], [200, 0], [130, 80, 'T6'], [420, 0], [65, 28, 'T7'], [400, 0]] }
  };
  const BASE = { m: 800, ClA: 4.0, CdA: 1.4, P: 750, mu: 1.6, sens: 0.1, rho: 1.2, rear: 0.55 };

  function trackGrid(segs, ds) {
    const r = [], name = []; let s = 0; const corners = [];
    segs.forEach(([len, rad, nm]) => {
      const n = Math.round(len / ds), start = r.length;
      for (let i = 0; i < n; i++) { r.push(rad); name.push(nm || ''); }
      if (rad) corners.push({ name: nm, start, end: r.length - 1, r: rad });
      s += len;
    });
    return { r, name, corners };
  }

  // tyre grip with load sensitivity: mu falls as load rises above static weight
  const muEff = (c, N) => c.mu * Math.pow(N / (c.m * g), -c.sens);

  function lapSim(carIn, trackKey = 'balanced', ds = 1) {
    const c = Object.assign({}, BASE, carIn), P = c.P * 1000, k = 0.5 * c.rho * c.ClA, kd = 0.5 * c.rho * c.CdA;
    const tr = TRACKS[trackKey], grid = trackGrid(tr.segs, ds), n = grid.r.length;
    const vTop = Math.cbrt(P / kd);                                   // drag-limited top speed
    const cornerV = rad => {
      if (!rad) return vTop;
      let lo = 1, hi = vTop;
      if (c.m * hi * hi / rad <= muEff(c, c.m * g + k * hi * hi) * (c.m * g + k * hi * hi)) return vTop;
      for (let i = 0; i < 60; i++) { const v = (lo + hi) / 2, N = c.m * g + k * v * v; if (c.m * v * v / rad > muEff(c, N) * N) hi = v; else lo = v; }
      return lo;
    };
    const vLim = grid.r.map(cornerV);
    const longAvail = (v, rad) => { const N = c.m * g + k * v * v, F = muEff(c, N) * N, lat = rad ? c.m * v * v / rad : 0; return Math.sqrt(Math.max(0, F * F - lat * lat)); };
    let i0 = 0; for (let i = 1; i < n; i++) if (vLim[i] < vLim[i0]) i0 = i;
    const vf = new Array(n), vb = new Array(n);
    vf[i0] = vLim[i0];
    for (let kk = 1; kk <= n; kk++) {                                   // forward pass: accelerate (power, traction)
      const i = (i0 + kk) % n, p = (i - 1 + n) % n, v = vf[p];
      const F = Math.min(P / Math.max(v, 5), c.rear * longAvail(v, grid.r[p])), a = (F - kd * v * v) / c.m;
      vf[i] = Math.min(Math.sqrt(Math.max(1, v * v + 2 * a * ds)), vLim[i]);
    }
    vb[i0] = vLim[i0];
    for (let kk = 1; kk <= n; kk++) {                                   // backward pass: braking
      const i = (i0 - kk + n) % n, nx = (i + 1) % n, v = vb[nx];
      const d = (longAvail(v, grid.r[nx]) + kd * v * v) / c.m;
      vb[i] = Math.min(Math.sqrt(v * v + 2 * d * ds), vLim[i]);
    }
    const v = vf.map((x, i) => Math.min(x, vb[i]));
    const t = [0], ax = [], ay = [];
    for (let i = 0; i < n; i++) {
      const nx = (i + 1) % n, dt = 2 * ds / (v[i] + v[nx]);
      if (i < n - 1) t.push(t[i] + dt); else t.lapTime = t[i] + dt;
      ax.push((v[nx] * v[nx] - v[i] * v[i]) / (2 * ds) / g);
      ay.push(grid.r[i] ? v[i] * v[i] / grid.r[i] / g : 0);
    }
    const lapTime = t.lapTime;
    const corners = grid.corners.map(co => { let m = Infinity; for (let i = co.start; i <= co.end; i++) m = Math.min(m, v[i]); return { name: co.name, r: co.r, apex: m }; });
    const x = v.map((_, i) => i * ds);
    const fullThrottle = v.filter((_, i) => ax[i] > 0.02 && P / v[i] < c.rear * longAvail(v[i], grid.r[i])).length / n;
    return { x, v, t, ax, ay, r: grid.r, lapTime, corners, vTop, length: n * ds, fullThrottle, car: c, track: tr.name };
  }

  // lap time sensitivity: ms change for +pct % on each input
  function sensitivities(car = {}, trackKey = 'balanced', pct = 1) {
    const base = lapSim(car, trackKey).lapTime, out = [];
    [['m', 'Mass'], ['ClA', 'Downforce (C_L·A)'], ['CdA', 'Drag (C_D·A)'], ['P', 'Power'], ['mu', 'Tyre grip (µ)']].forEach(([key, label]) => {
      const c = Object.assign({}, BASE, car); c[key] *= 1 + pct / 100;
      out.push({ key, label, dt: (lapSim(c, trackKey).lapTime - base) * 1000 });
    });
    return { base, rows: out.sort((a, b) => Math.abs(b.dt) - Math.abs(a.dt)) };
  }

  // wing level couples downforce and drag: C_D·A rises with C_L·A
  const wingCar = (ClA, car = {}) => Object.assign({}, BASE, car, { ClA, CdA: 0.3 + 0.15 * ClA + 0.03 * ClA * ClA });

  // synthetic telemetry from a lap: channels for the data lab
  function telemetry(sim, every = 5, noise = 0) {
    const rows = [], vmax = sim.vTop;
    for (let i = 0; i < sim.x.length; i += every) {
      const v = sim.v[i], ax = sim.ax[i], kph = toKmh(v);
      const gear = Math.max(1, Math.min(8, Math.ceil(kph / (toKmh(vmax) / 8.2))));
      const thr = ax > 0.03 ? 100 : ax > -0.05 ? 35 : 0, brk = ax < -0.3 ? Math.min(100, Math.round(-ax / 5.5 * 100)) : 0;
      const steer = sim.r[i] ? Math.min(180, 1800 / sim.r[i]) : 0;
      rows.push({ distance_m: sim.x[i], time_s: +sim.t[i].toFixed(3), speed_kph: +(kph + noise * randn()).toFixed(1), throttle_pct: thr, brake_pct: brk, gear,
        steer_deg: +steer.toFixed(1), lat_g: +(sim.ay[i] + noise * 0.05 * randn()).toFixed(3), lon_g: +(ax + noise * 0.05 * randn()).toFixed(3) });
    }
    return rows;
  }

  return { g, kmh, toKmh, rnd, pick, shuffle, sgn, fmtTime, latLT, lonLT, downforce, drag, dragPower, cornerSpeedNoAero, cornerSpeedAero,
    wheelRate, natFreq, dampRatio, pacejka, stepResponse, mean, sd, se, randn, TRACKS, BASE, lapSim, sensitivities, wingCar, telemetry, muEff };
})();
if (typeof module !== 'undefined') module.exports = Model;

<script>
// Minimal SVG line chart: series = [{name, color, points:[{x,y}]}], opts = {xLabel, yLabel, mark:{x,y,label}, h}
const Charts = (() => {
  function nice(min, max, n = 5) {
    const span = max - min || 1, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
    return { lo, hi, ticks };
  }
  function line(series, opts = {}) {
    const W = 680, H = opts.h || 300, L = 62, R = 18, T = 16, B = 46;
    const xs = series.flatMap(s => s.points.map(p => p.x)), ys = series.flatMap(s => s.points.map(p => p.y));
    const xa = nice(Math.min(...xs), Math.max(...xs), 6), ya = nice(Math.min(...ys), Math.max(...ys), 5);
    const X = x => L + (x - xa.lo) / (xa.hi - xa.lo) * (W - L - R), Y = y => H - B - (y - ya.lo) / (ya.hi - ya.lo) * (H - T - B);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.aria || 'chart'}">`;
    ya.ticks.forEach(t => { s += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${+t.toFixed(2)}</text>`; });
    xa.ticks.forEach(t => { s += `<text x="${X(t)}" y="${H - B + 18}" text-anchor="middle">${+t.toFixed(2)}</text>`; });
    s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/>`;
    if (opts.xLabel) s += `<text x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle">${opts.xLabel}</text>`;
    if (opts.yLabel) s += `<text transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">${opts.yLabel}</text>`;
    series.forEach(se => {
      const d = se.points.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join('');
      s += `<path class="line" d="${d}" stroke="${se.color}"${se.dash ? ' stroke-dasharray="6 5"' : ''}/>`;
      if (se.name) { const last = se.points[se.points.length - 1]; s += `<text class="lbl" x="${Math.min(X(last.x) - 4, W - R - 4)}" y="${Y(last.y) - 8}" text-anchor="end">${se.name}</text>`; }
    });
    if (opts.mark) { const m = opts.mark; s += `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="5.5" fill="var(--soft)"/><text class="lbl" x="${X(m.x)}" y="${Y(m.y) + 22}" text-anchor="middle">${m.label}</text>`; }
    return s + '</svg>';
  }
  // horizontal bar chart: rows = [{label, value}], signed values around zero
  function bars(rows, opts = {}) {
    const W = 680, rowH = 34, L = 190, R = 70, T = 10, H = T + rows.length * rowH + 10;
    const mx = Math.max(...rows.map(r => Math.abs(r.value))) || 1, mid = L + (W - L - R) / 2, sc = (W - L - R) / 2 / mx;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.aria || 'bar chart'}">`;
    s += `<line class="axis" x1="${mid}" x2="${mid}" y1="${T}" y2="${H - 6}"/>`;
    rows.forEach((r, i) => {
      const y = T + i * rowH, w = Math.abs(r.value) * sc, x = r.value < 0 ? mid - w : mid;
      s += `<text x="${L - 10}" y="${y + 21}" text-anchor="end" class="lbl">${r.label}</text>`;
      s += `<rect x="${x}" y="${y + 6}" width="${Math.max(w, 1)}" height="22" rx="3" fill="${r.value < 0 ? 'var(--good)' : 'var(--bad)'}" opacity=".8"/>`;
      s += `<text x="${W - 4}" y="${y + 21}" text-anchor="end">${(r.value > 0 ? '+' : '') + r.value.toFixed(opts.dp ?? 0)}${opts.unit || ''}</text>`;
    });
    return s + '</svg>';
  }
  return { line, bars };
})();

</script>

LEARN.push({ id: 'role', title: 'What vehicle performance does', blurb: 'The job before, during and after an event',

LEARN.push({ id: 'laptime', title: 'Where lap time comes from', blurb: 'Corners, straights and the friction circle',
html: `
<p class="lead">A lap is a sequence of braking, cornering and accelerating, each limited by tyre grip, power or drag. The car is almost always at one of these limits; lap time comes from raising the limit that matters most at that point of the track.</p>
<h2>The three limits</h2>
<ul><li><b>Grip-limited:</b> braking zones, corners and low-speed acceleration. Set by tyre grip and vertical load (weight plus downforce).</li>
<li><b>Power-limited:</b> accelerating once traction is no longer the limit. Set by power available.</li>
<li><b>Drag-limited:</b> at high speed, more of the power goes into overcoming drag; top speed is where power equals drag power.</li></ul>
<h2>The friction circle</h2>
<p>A tyre can give a maximum total force. Use it all for cornering and none is left for braking or acceleration. Good drivers blend the two (trail braking into a corner, progressive throttle on exit), staying on the edge of the circle.</p>
${FX('Combined grip: √(F<sub>x</sub>² + F<sub>y</sub>²) ≤ µ·F<sub>z</sub>')}
<h2>Why minimum corner speed matters</h2>
<p>Exit speed carries all the way down the next straight. A small gain at the exit of a slow corner is worth time for the whole straight that follows.</p>
${WK('Worked example (illustrative)', 'A 400 m straight with a constant 1.0 g of acceleration. Exit at 100 km/h: v<sub>end</sub> = √(27.78² + 2 × 9.81 × 400) = 92.84 m/s, time = (92.84 − 27.78) ÷ 9.81 = 6.632 s.<br>Exit at 102 km/h: v<sub>end</sub> = 93.01 m/s, time = 6.593 s.<br>Gain ≈ <b>0.04 s</b> from 2 km/h at one corner exit. Over several slow corners this adds up quickly.')}
${TRAP('saying top speed matters most. Most lap time is in braking, corners and exits; top speed matters at power circuits and for overtaking.')}`,
say: 'The car is always at a limit: grip in braking and corners, traction then power on exit, and drag at high speed. Lap time comes from raising whichever limit matters most. Minimum corner speed is valuable because exit speed carries down the whole next straight.' });

LEARN.push({ id: 'tyres', title: 'Tyres', blurb: 'Slip, load sensitivity and temperature',
html: `
<p class="lead">Tyres make every force on the car. They produce force through slip: a small difference between where the wheel points and where it goes (slip angle), or between wheel speed and road speed (slip ratio).</p>
<h2>Key ideas</h2>
<ul><li><b>Slip angle α:</b> lateral force rises almost linearly with slip angle, then peaks and falls away as the tyre slides.</li>
<li><b>Slip ratio κ:</b> the same for braking and traction forces.</li>
<li><b>Cornering stiffness:</b> the slope of lateral force against slip angle near zero.</li>
<li><b>Load sensitivity:</b> grip rises with load, but less than proportionally, so the friction coefficient µ falls as load rises.</li>
<li><b>Temperature window:</b> grip is highest in a temperature range. Too cold: low grip and graining. Too hot: overheating, blistering and faster wear.</li></ul>
<h2>The Magic Formula</h2>
<p>Pacejka's Magic Formula is the standard empirical tyre model:</p>
${FX('y = D · sin(C · arctan(Bx − E(Bx − arctan Bx)))')}
<p>D sets the peak, C the shape, B the initial stiffness (BCD is the cornering stiffness) and E the curvature near the peak. Try it in the <a href="#/tools/tyre">tyre curve tool</a>.</p>
${WK('Worked example: load sensitivity (illustrative)', 'At 4 kN load µ = 1.8, so the force is 7.2 kN. At 6 kN µ = 1.65, so the force is 9.9 kN.<br>50% more load gives only 9.9 ÷ 7.2 − 1 = <b>37.5% more grip</b>. This is why load transfer costs total grip.')}
${TRAP('assuming grip is proportional to load. If it were, load transfer would not matter and downforce would add grip exactly in proportion.')}`,
say: 'Tyres make force through slip angle and slip ratio. Force rises with slip, peaks and falls. Grip rises with load but less than proportionally, which is load sensitivity, and tyres only work well in a temperature window. The Pacejka Magic Formula is the standard way to model the curve.' });

LEARN.push({ id: 'loadtransfer', title: 'Load transfer', blurb: 'Why it happens and why it costs grip',
html: `
<p class="lead">When the car accelerates, brakes or corners, the inertial force acts at the centre of gravity, above the ground, while the tyre forces act at ground level. The resulting moment moves load from one set of wheels to the other.</p>
${FX('Lateral: ΔF<sub>z</sub> = m · a<sub>y</sub> · h ÷ t &nbsp;&nbsp; Longitudinal: ΔF<sub>z</sub> = m · a<sub>x</sub> · h ÷ L')}
<p>m mass, a acceleration, h centre of gravity height, t track width, L wheelbase. Total lateral transfer depends only on these, not on springs or bars.</p>
${WK('Worked example (illustrative)', 'm = 800 kg, a<sub>y</sub> = 4 g, h = 0.30 m, t = 1.6 m.<br>ΔF<sub>z</sub> = 800 × 4 × 9.81 × 0.30 ÷ 1.6 = <b>5.9 kN</b> moves from the inside to the outside wheels.')}
<h2>Why it costs grip</h2>
<p>Because of load sensitivity, the loaded tyre gains less grip than the unloaded tyre loses.</p>
${WK('Worked example (illustrative)', 'Take µ = 2.0 − 0.1 × F<sub>z</sub> (F<sub>z</sub> in kN). Two tyres at 5 kN each: µ = 1.5, total grip = 2 × 7.5 = 15.0 kN.<br>Transfer 2 kN: 7 kN gives µ = 1.3 and 9.1 kN; 3 kN gives µ = 1.7 and 5.1 kN. Total = 14.2 kN, so <b>0.8 kN (5%) of grip is lost</b>.')}
<h2>Front-rear split and balance</h2>
<p>Springs and anti-roll bars do not change total lateral load transfer; they change how it is shared between front and rear. The axle with the larger share of roll stiffness takes more of the transfer, loses more grip and tends to slide first. A stiffer front bar increases understeer; a stiffer rear bar increases oversteer.</p>
<ul><li><b>Lower CoG and wider track</b> reduce total transfer.</li>
<li><b>Geometric transfer</b> goes through the suspension links (set by roll centre height), <b>elastic transfer</b> through springs and bars.</li></ul>
${TRAP('saying stiffer anti-roll bars reduce load transfer. They reduce roll, and move transfer between axles, but the total is set by m, a, h and t.')}`,
say: 'Inertial force acts at the centre of gravity above the ground, so accelerating, braking and cornering move load between wheels: m a h over track or wheelbase. Because grip is load-sensitive, the outside tyre gains less than the inside loses, so transfer costs grip. Springs and bars only share it between front and rear, which sets the balance.' });

LEARN.push({ id: 'aero', title: 'Aerodynamics for performance', blurb: 'Downforce, drag, balance and cooling',
html: `
<p class="lead">Downforce adds vertical load without adding mass, so it raises grip in fast corners and under braking. Drag costs straight-line speed. Vehicle performance looks for the best trade-off for each circuit.</p>
${FX('Downforce = ½ρV²·C<sub>L</sub>A &nbsp;&nbsp; Drag = ½ρV²·C<sub>D</sub>A &nbsp;&nbsp; Drag power = Drag × V')}
${WK('Worked example (illustrative)', 'C<sub>L</sub>A = 4.5 m², 250 km/h = 69.4 m/s, ρ = 1.2 kg/m³: downforce = 0.5 × 1.2 × 69.4² × 4.5 ≈ <b>13.0 kN</b>, about 1.7 times the weight of an 800 kg car.<br>Drag power with C<sub>D</sub>A = 1.2 m² at 300 km/h: 0.5 × 1.2 × 1.2 × 83.3³ ≈ <b>417 kW</b>.')}
<h2>Ideas to know</h2>
<ul><li><b>V² law:</b> double the speed, four times the downforce. Slow corners rely on mechanical grip, fast corners on aero grip.</li>
<li><b>Efficiency (L/D):</b> downforce per unit drag. Wing additions usually cost more drag per unit of downforce than floor downforce.</li>
<li><b>Aero balance:</b> where the centre of pressure sits front to rear. Moving it forward adds front grip and reduces high-speed understeer.</li>
<li><b>Ride height and pitch sensitivity:</b> ground-effect floors make downforce change with ride height. Teams aim for a stable aero platform; low ride heights can cause porpoising and plank wear.</li>
<li><b>Cooling:</b> larger cooling openings cost drag and downforce. Hot races need more cooling, which costs lap time; it is part of the setup trade-off.</li>
<li><b>Following another car:</b> the wake reduces downforce for the car behind, which makes following and overtaking harder.</li>
<li><b>Air density:</b> lower density (heat, altitude) reduces both downforce and drag. In the International Standard Atmosphere, density at 2,240 m is about 0.98 kg/m³, 20% below the sea-level 1.225 kg/m³.</li></ul>
${TRAP('forgetting both sides of the trade-off. More downforce helps corners and braking but the extra drag costs straight-line speed; the best level depends on the circuit.')}`,
say: 'Downforce is half rho V squared times C L A, so it grows with speed squared: it adds grip without mass, mainly in fast corners and braking. Drag costs straight-line speed. The best wing level depends on the circuit, and aero balance, ride height sensitivity and cooling are part of the setup.' });

LEARN.push({ id: 'balance', title: 'Balance and handling', blurb: 'Understeer, oversteer and how to fix them',
html: `
<p class="lead">Balance describes which end of the car reaches its grip limit first. If the front slides first the car understeers; if the rear slides first it oversteers.</p>
${FX('Steady state: δ = L ÷ R + K · a<sub>y</sub> &nbsp;&nbsp; K = W<sub>f</sub> ÷ C<sub>αf</sub> − W<sub>r</sub> ÷ C<sub>αr</sub>')}
<p>δ steer angle, L wheelbase, R radius, K understeer gradient, W axle loads, C<sub>α</sub> axle cornering stiffness. K &gt; 0 understeer, K = 0 neutral, K &lt; 0 oversteer (Gillespie's form).</p>
<h2>Balance through a corner</h2>
<table><tr><th>Phase</th><th>Typical complaint</th><th>Things that affect it</th></tr>
<tr><td>Entry (braking, turning in)</td><td>Rear unstable, or front won't turn</td><td>Brake balance, diff preload or locking on entry, front-rear roll stiffness, engine braking and regeneration</td></tr>
<tr><td>Mid-corner (apex)</td><td>Understeer or oversteer at constant speed</td><td>Roll stiffness split, aero balance, ride heights, tyre temperatures</td></tr>
<tr><td>Exit (traction)</td><td>Wheelspin or power understeer</td><td>Diff locking on exit, rear grip, traction settings, deployment</td></tr></table>
<h2>Speed matters</h2>
<p>A car can understeer in slow corners (mechanical balance) and oversteer in fast ones (aero balance), because aero balance and load rise with speed. Ask the driver where in the corner and at what speed.</p>
<h2>Weight distribution and ballast</h2>
<p>Moving mass rearwards loads the rear tyres more. Cars are built under the minimum weight where possible, and the difference made up with ballast placed to tune balance within the rules.</p>
${TRAP('mixing up the fixes. To reduce understeer you add front grip or reduce rear grip: softer front bar, stiffer rear bar, more front wing, or brake balance changes on entry.')}`,
say: 'Balance is which end reaches its limit first: front first is understeer, rear first is oversteer. It changes through the corner and with speed, so I would first ask where and how fast. Fixes add grip at the sliding end or remove it at the other: roll stiffness split, aero balance, brake balance and diff settings.' });

LEARN.push({ id: 'setup', title: 'Suspension and setup', blurb: 'What each adjustment changes',
html: `
<p class="lead">Setup adjusts the car for a circuit and a driver. Each change trades one thing for another, so you need to know what it does and what it costs.</p>
<table><tr><th>Adjustment</th><th>Main effect</th><th>Trade-off</th></tr>
<tr><td>Springs</td><td>Ride height control, platform for aero, response</td><td>Stiffer: better aero platform, worse over bumps and kerbs</td></tr>
<tr><td>Anti-roll bars</td><td>Front-rear share of lateral load transfer</td><td>Balance against mechanical grip on that axle</td></tr>
<tr><td>Dampers</td><td>Transient response, bump and kerb behaviour, tyre contact</td><td>Too stiff: skipping over bumps; too soft: slow response, pitch</td></tr>
<tr><td>Ride height and rake</td><td>Aero load and balance, plank wear</td><td>Lower: more downforce until bottoming or porpoising</td></tr>
<tr><td>Camber</td><td>Tyre contact patch in roll</td><td>More negative: cornering grip against braking and traction, tyre temperature</td></tr>
<tr><td>Toe</td><td>Stability and turn-in</td><td>Toe-out front: sharper turn-in; toe-in rear: stability; both add drag and heat</td></tr>
<tr><td>Wing levels</td><td>Downforce and aero balance</td><td>Drag</td></tr>
<tr><td>Brake balance</td><td>Front-rear braking split</td><td>Too far rear: rear locking and instability</td></tr>
<tr><td>Differential</td><td>How much the rear wheels are locked together</td><td>More locking on exit: traction, but understeer; on entry: stability</td></tr>
<tr><td>Steering geometry (Ackermann)</td><td>Inside and outside front steer angles</td><td>Low-speed turning against tyre scrub and temperature</td></tr></table>
${FX('Wheel rate k<sub>w</sub> = k<sub>spring</sub> × MR² &nbsp;&nbsp; f = (1 ÷ 2π)·√(k<sub>w</sub> ÷ m) &nbsp;&nbsp; ζ = c ÷ (2√(k m))')}
<p>MR is the motion ratio (spring travel per unit wheel travel). Road cars typically run ride frequencies around 1 to 1.5 Hz; high-downforce race cars run far stiffer to control ride height for the aero platform.</p>
${WK('Worked example (illustrative)', 'Spring 200 N/mm, motion ratio 0.6: wheel rate = 200 × 0.6² = <b>72 N/mm</b>.<br>With 200 kg of sprung mass on that corner: f = (1 ÷ 2π) × √(72,000 ÷ 200) = <b>3.0 Hz</b>.')}
${TRAP('confusing spring rate and wheel rate. The motion ratio enters squared: once for force, once for displacement.')}`,
say: 'Each setup change trades something. Springs and ride height control the aero platform, bars set the front-rear share of load transfer and so the balance, dampers control transients, camber and toe set how the tyre works, and brake balance and diff shape entry and exit. Wheel rate is spring rate times motion ratio squared.' });

LEARN.push({ id: 'braking', title: 'Braking and powertrain', blurb: 'Traction, power and braking limits',
html: `
<p class="lead">Under braking, grip and drag both slow the car. Accelerating, the car is first traction-limited and then power-limited.</p>
${FX('Peak deceleration ≈ [µ(mg + ½ρV²C<sub>L</sub>A) + ½ρV²C<sub>D</sub>A] ÷ m')}
${WK('Worked example (illustrative)', 'At 300 km/h (83.3 m/s), m = 800 kg, µ = 1.7, C<sub>L</sub>A = 4.0, C<sub>D</sub>A = 1.2: downforce = 16.7 kN, drag = 5.0 kN.<br>Deceleration = [1.7 × (7.85 + 16.7) + 5.0] ÷ 0.8 ≈ 58 m/s² ≈ <b>5.9 g</b>. It falls as speed falls, because downforce and drag fall with V².')}
<h2>Traction or power?</h2>
<p>At low speed the rear tyres cannot use all the power (traction-limited). Above a crossover speed, power is the limit: F = P ÷ V.</p>
${WK('Worked example (illustrative)', 'Rear tyres carry 55% of the load, µ = 1.7, power 750 kW. Solve P ÷ V = 0.55 × 1.7 × (mg + ½ρV²C<sub>L</sub>A): the crossover is about <b>196 km/h</b>. Below it, extra power does nothing; traction and the diff matter.')}
<h2>Braking system ideas</h2>
<ul><li><b>Brake balance:</b> more front bias is stable; too much rear bias locks the rears.</li>
<li><b>Brake-by-wire:</b> the rear axle blends hydraulic braking with energy recovery by the MGU-K, so the system manages rear braking torque.</li>
<li><b>Brake temperatures:</b> carbon brakes need a temperature window; cooling ducts trade temperature against drag.</li>
<li><b>Gear ratios:</b> chosen per circuit for acceleration and top speed.</li></ul>
${TRAP('saying more power always helps. Below the traction limit it does nothing, and on a high-downforce circuit the car may be grip-limited for most of the lap.')}`,
say: 'Braking is limited by grip plus drag, so the deceleration is highest at high speed when downforce is high. Accelerating, the car is traction-limited at low speed and power-limited above a crossover speed. Brake balance, brake-by-wire with energy recovery, and gearing all feed into the setup.' });

LEARN.push({ id: 'energy', title: 'Energy and the 2026 regulations', blurb: 'Hybrid power, active aero, lighter cars',
html: `
<p class="lead">The 2026 regulations made energy management central to vehicle performance: nearly half the peak power is electrical, and how energy is harvested and deployed around a lap shapes lap time.</p>
<h2>Key numbers (FIA figures)</h2>
<table><tr><th>Item</th><th>2022 to 2025 cars</th><th>2026 cars</th></tr>
<tr><td>Combustion engine power</td><td>550 to 560 kW</td><td>400 kW</td></tr>
<tr><td>MGU-K power</td><td>120 kW</td><td>350 kW</td></tr>
<tr><td>Energy recoverable under braking</td><td>about half the 2026 figure</td><td>8.5 MJ per lap (doubled)</td></tr>
<tr><td>MGU-H</td><td>Fitted</td><td>Removed</td></tr>
<tr><td>Fuel</td><td>Partly sustainable</td><td>100% sustainable</td></tr>
<tr><td>Minimum mass</td><td>798 kg (2022)</td><td>768 kg, 30 kg less than 2022</td></tr>
<tr><td>Maximum wheelbase</td><td>3,600 mm</td><td>3,400 mm (Article C2.3.3)</td></tr>
<tr><td>Maximum width</td><td>2,000 mm</td><td>1,900 mm (no part more than 950 mm from the centreline, Article C2.3.1)</td></tr>
<tr><td>Tyres</td><td>18-inch wheels</td><td>18-inch wheels; fronts 25 mm and rears 30 mm narrower</td></tr></table>
<h2>Active aerodynamics</h2>
<p>The front and rear wings each have two fixed states defined in the technical regulations (Articles C3.10.10 and C3.11.6): <b>Corner Mode</b> (high downforce) and <b>Straight Mode</b> (reduced flap incidence, low drag). DRS no longer exists. The FIA's launch figures were about 30% less downforce and 55% less drag than the previous cars.</p>
<h2>Overtaking and deployment</h2>
<p>At launch, the FIA described an MGU-K override for a following car: 350 kW up to 337 km/h plus 0.5 MJ of extra energy, while the leading car's deployment tapered from 290 km/h to zero at 355 km/h. The FIA refined the rules in April 2026: in races, Boost is capped at 150 kW above the car's current power; MGU-K deployment stays at 350 kW in key acceleration zones but is limited to 250 kW elsewhere; and in qualifying, maximum recharge was cut from 8 MJ to 7 MJ per lap.</p>
<h2>What it means for vehicle performance</h2>
<ul><li><b>Energy is a budget:</b> the lap sim has to plan where to harvest (braking, lifting, and harvesting at full throttle near the end of straights, which the FIA calls superclipping) and where to deploy.</li>
<li><b>Deployment pays most</b> where the car is power-limited and the gain carries furthest: the exits of slow corners onto long straights.</li>
<li><b>Circuits differ:</b> few heavy braking zones means less energy to recover, so some circuits are energy-limited.</li>
<li><b>Mode switching</b> between low drag and high downforce changes the drag-downforce trade-off compared with fixed wings.</li></ul>
<div class="note">Regulations change during a season. In an interview, give the outline confidently and say you would check the latest issue of the FIA regulations: that is exactly what an engineer would do.</div>`,
say: 'In 2026 nearly half the peak power is electrical: 400 kW from the engine and 350 kW from the MGU-K, with up to 8.5 MJ recoverable per lap under braking and no MGU-H. Cars are lighter and smaller, and active aero switches between Corner Mode and Straight Mode. For vehicle performance, energy becomes a budget to optimise around the lap, and I would check the latest regulation issue because it was refined during the season.' });

LEARN.push({ id: 'lapsim', title: 'Lap time simulation', blurb: 'How a lap sim works, step by step',
html: `
<p class="lead">A lap time simulation predicts the fastest the car can go around a circuit, given its properties. It lets engineers test setups and upgrades before they reach the track.</p>
<h2>The point-mass method</h2>
<ol><li><b>Discretise the track</b> into small steps (say 1 m) with a curvature (1 ÷ radius) at each point.</li>
<li><b>Apex speed limits:</b> at each point, find the highest speed where the tyres can provide the lateral force: m V² ÷ r = µ (mg + ½ρV²C<sub>L</sub>A).</li>
<li><b>Forward pass:</b> from the slowest point, accelerate using the force available (the smaller of power and traction, minus drag), never exceeding the speed limit.</li>
<li><b>Backward pass:</b> run backwards from the slowest point, applying maximum braking, to find where braking must start.</li>
<li><b>Combine:</b> the speed at each point is the minimum of the forward and backward passes. Integrate time = distance ÷ speed.</li></ol>
${WK('Worked example (illustrative)', 'A 50 m radius corner, µ = 1.8. Without downforce: V = √(µgr) = √(1.8 × 9.81 × 50) = 29.7 m/s = <b>107 km/h</b>.<br>With C<sub>L</sub>A = 4.0, m = 800 kg, ρ = 1.2: V² = µmg ÷ (m ÷ r − µ × ½ρC<sub>L</sub>A) = 14,126 ÷ (16 − 4.32) = 1,210, so V = 34.8 m/s = <b>125 km/h</b>.')}
<h2>More detailed simulations</h2>
<ul><li><b>Quasi-steady-state:</b> at each point, solve for a balanced car with load transfer, tyre models and aero maps (downforce depending on ride height). This captures balance, not just grip.</li>
<li><b>Transient:</b> integrate the equations of motion in time with a driver model; captures dynamics such as yaw response.</li>
<li><b>Optimal control:</b> treat the lap as an optimisation problem and solve for the fastest inputs and line.</li></ul>
<p>Try the <a href="#/tools/lapsim">lap sim tool</a>: it uses exactly this point-mass method.</p>
${TRAP('not knowing the forward and backward pass. It is the standard first question about lap sims.')}`,
say: 'A point-mass lap sim discretises the track, finds the maximum cornering speed at each point from grip and downforce, then runs a forward pass accelerating with power and traction and a backward pass braking. The speed is the minimum of the two, and integrating gives lap time. More detailed sims add load transfer, tyre models, aero maps and transients.' });

LEARN.push({ id: 'sweeps', title: 'Setup sweeps and sensitivities', blurb: 'Finding trade-offs and optimums',
html: `
<p class="lead">A setup sweep changes one parameter over a range, runs the simulation at each value and plots lap time. Sensitivities summarise how much lap time each input is worth.</p>
<h2>How to run and report a sweep</h2>
<ol><li>State the question: "what wing level is fastest at this circuit?"</li>
<li>Choose a range wide enough that the optimum is inside it; if the best value is at the edge, extend the range.</li>
<li>Check the step size is fine enough to find the optimum.</li>
<li>Report <b>where</b> the time comes from: corners, straights, sectors. A net number alone hides the trade-off.</li>
<li>Check the result is robust: does it change with fuel load, temperature or tyre model?</li></ol>
${WK('Worked example (illustrative)', 'One more wing click costs +0.08 s on the straights but gains 0.12 s in corners. Net: <b>−0.04 s</b> per lap, so add the wing, but note the slower top speed for overtaking and defending.')}
<h2>Sensitivities</h2>
<p>Expressed as lap time per unit change, for example ms per kg or ms per 1% of downforce. They answer "which variable matters most here?" and help decide which upgrades to prioritise. They change by circuit: drag matters more at a power circuit, downforce at a twisty one.</p>
${FX('Δt ≈ Σ (∂t ÷ ∂x<sub>i</sub>) · Δx<sub>i</sub> &nbsp;&nbsp; (valid for small changes; interactions need more than one-at-a-time)')}
<p>Run the <a href="#/tools/sweep">setup sweep</a> and <a href="#/tools/sensitivity">sensitivity</a> tools on all three circuits to see this.</p>
${TRAP('reporting a gain without saying where it comes from, or trusting an optimum at the edge of the swept range.')}`,
say: 'A sweep varies one parameter, simulates each value and plots lap time to find the optimum and the trade-off. I would check the optimum is inside the range, report where the time comes from, and check robustness. Sensitivities like milliseconds per kilogram show which variables matter most at each circuit.' });

</script>

LEARN.push({ id: 'correlation', title: 'Correlation', blurb: 'Making the model match reality, honestly',
html: `
<p class="lead">Correlation is checking the simulation against real data (track, driver-in-the-loop simulator, rigs, wind tunnel) and improving the model where it disagrees. A model is only useful if you know how far to trust it.</p>
<h2>A correlation process</h2>
<ol><li><b>Match the conditions:</b> same setup, fuel, tyres, track temperature and wind as the real run.</li>
<li><b>Overlay traces</b> against distance: speed, throttle, brake, lateral g, ride heights. Use a delta-time trace to see where time is gained or lost.</li>
<li><b>Locate the difference:</b> which corners, which phase (entry, mid, exit), which speeds?</li>
<li><b>Form hypotheses:</b> tyre grip, aero map, ride height, power, driver line or technique.</li>
<li><b>Test with evidence:</b> does the same input error explain several corners? Change one input at a time.</li>
<li><b>Document:</b> what changed, why, and how much the agreement improved.</li></ol>
${WK('Example', 'The sim is 4 km/h faster than the car at the apex of a 120 km/h corner, but matches in fast corners. That points to mechanical grip (tyre model, low-speed balance) rather than the aero map. If fast corners were off too, check aero and ride height.')}
<h2>Avoid over-fitting</h2>
<p>Tuning many parameters to match one lap can make the model match that lap for the wrong reasons. Validate the changed model on other laps, circuits or conditions it was not tuned on.</p>
<h2>Driver-in-the-loop (DiL)</h2>
<p>A DiL simulator puts a real driver in a full vehicle model. It tests setups and driver feel before an event, and the driver's comments plus data help correlate the model.</p>
${TRAP('tuning the model to match a single lap. Say how you would validate it on independent data.')}`,
say: 'Correlation means matching conditions, overlaying sim and car traces against distance, locating where they differ, and testing hypotheses one input at a time. I would be careful not to over-fit to one lap and would validate any change on independent data, and document it.' });

LEARN.push({ id: 'data', title: 'Data and statistics', blurb: 'Channels, noise and real differences',
html: `
<p class="lead">Every conclusion about the car comes from data, and data is noisy. The skill is telling a real change from noise and from other changes happening at the same time.</p>
<h2>Common channels</h2>
<p>Speed, throttle, brake pressure, steering angle, gear, engine speed, lateral and longitudinal acceleration, yaw rate, ride heights, damper positions, tyre pressures and temperatures, brake temperatures, energy state, GPS position.</p>
<h2>Statistics you should be able to do</h2>
${FX('Mean x̄ = Σx ÷ n &nbsp;&nbsp; Standard deviation s &nbsp;&nbsp; Standard error SE = s ÷ √n &nbsp;&nbsp; 95% interval ≈ x̄ ± 1.96 SE')}
${WK('Worked example (illustrative)', 'A change gives a 0.06 s gain averaged over five laps, with a lap-to-lap standard deviation of 0.1 s. SE = 0.1 ÷ √5 = 0.045 s. The gain is only 1.3 standard errors from zero: <b>not convincing</b>. You need more laps or a cleaner test. (With very small samples, a t-distribution gives a slightly wider interval.)')}
<h2>Confounders</h2>
<p>Fuel burn, tyre wear, track evolution (rubber goes down and the track gets faster), temperature, wind and traffic all change lap time. Fuel-correct, compare like with like, and change one thing at a time where you can.</p>
<p>The <a href="#/learn/uncertainty">uncertainty page</a> covers error propagation and how many laps you need.</p>
${TRAP('trusting one fast lap. Always ask about spread, sample size and what else changed.')}`,
say: 'I would look at mean, spread and standard error rather than single laps, and check for confounders like fuel, tyre wear, track evolution and wind. A 0.06 second gain over five laps with a 0.1 second spread is within the noise, so I would want more laps before recommending the change.' });

LEARN.push({ id: 'rigs', title: 'Rigs, DiL and testing', blurb: 'What each test tool tells you',
html: `
<p class="lead">Track time is limited, so teams use several tools, each good at one thing. Vehicle performance links them together through correlation.</p>
<table><tr><th>Tool</th><th>What it does</th><th>What it tells you</th></tr>
<tr><td>Seven-post rig</td><td>Four actuators under the wheels replay road inputs; three more act on the sprung mass to represent aerodynamic and inertial loads (heave, pitch and roll)</td><td>Ride, damping and platform control, tyre load variation, kerb behaviour</td></tr>
<tr><td>K&amp;C rig</td><td>Measures kinematics (geometry change with wheel travel) and compliance (deflection under load)</td><td>Camber gain, bump steer, roll centres, real stiffnesses</td></tr>
<tr><td>Wind tunnel</td><td>A scale model (maximum scale set by the regulations) on a moving ground</td><td>Aero maps: downforce, drag and balance against ride height, yaw and steer</td></tr>
<tr><td>CFD</td><td>Numerical airflow simulation</td><td>Flow detail, early concepts, conditions a tunnel cannot reproduce</td></tr>
<tr><td>DiL simulator</td><td>A real driver in a full vehicle model</td><td>Setup and driver feel before an event, driver-model correlation</td></tr>
<tr><td>Track testing and practice</td><td>The real thing</td><td>Ground truth for every model</td></tr></table>
<h2>Testing limits</h2>
<p>F1 limits aero testing: wind tunnel runs and CFD are restricted, with a sliding scale by championship position. Spending is limited by the cost cap. Efficient testing and good correlation are therefore valuable.</p>
${TRAP('not knowing what DiL stands for, or not being able to say why a team would use a seven-post rig instead of track time.')}`,
say: 'A seven-post rig shakes the car with four wheel actuators and three aero loaders to tune ride and damping; a K&C rig measures geometry and compliance; the tunnel and CFD give aero maps; and the DiL puts a real driver in the model. Testing is restricted, so correlating these tools well is valuable.' });

LEARN.push({ id: 'weekend', title: 'Race weekend and regulations', blurb: 'Workflow, parc fermé and limits',
html: `
<p class="lead">A race weekend is a short, intense optimisation with strict rules on what can change and when.</p>
<h2>Workflow</h2>
<ol><li><b>Before:</b> track characterisation, simulations, baseline setup, DiL sessions, run plan.</li>
<li><b>Practice:</b> run plan items (setup tests, tyre long runs, aero checks), correlation, setup changes between sessions.</li>
<li><b>Qualifying:</b> parc fermé applies from when the car first leaves the pit lane in qualifying, so the setup must be right before then.</li>
<li><b>Race:</b> live support from the factory and trackside; tyre and energy monitoring.</li>
<li><b>After:</b> debrief, post-event report, model updates.</li></ol>
<h2>Rules that constrain setup</h2>
<ul><li><b>Parc fermé (Sporting Regulations, Article B3.5):</b> from when the car first leaves the pit lane in qualifying until the race start (and the same for sprint qualifying and the sprint), only work listed in the regulations or approved by the Technical Delegate is allowed. Unpermitted changes mean starting from the pit lane.</li>
<li><b>Plank wear:</b> under the 2026 Technical Regulations (Article C3.6.1(d)) the plank is 10 mm ± 0.2 mm thick when new, and a minimum of 8 mm is accepted after wear. Under the previous rules, cars were disqualified for excess wear, for example car 44 at the 2023 United States Grand Prix (FIA stewards' decision). Low ride heights and bumpy circuits raise the risk.</li>
<li><b>Minimum mass</b> and component limits; <b>aero testing restrictions</b>; the <b>cost cap</b>.</li>
<li><b>Sprint weekends</b> have only one practice session, so pre-event simulation matters even more.</li></ul>
${TRAP('vague answers about race support. Be specific: monitoring data, quick checks, short clear messages, and post-race analysis.')}`,
say: 'Before an event we simulate and plan; in practice we correlate and tune; parc fermé applies from qualifying, so setup must be right before then; in the race we support live; afterwards we debrief and update models. Rules like plank wear limits and testing restrictions constrain what we can do.' });

LEARN.push({ id: 'modelling', title: 'Modelling good practice', blurb: 'Trusting your own tools',
html: `
<p class="lead">The advert asks you to develop, validate and maintain models and tools. Good practice is what makes a tool trustworthy for someone else.</p>
<h2>Checklist</h2>
<ul><li><b>Units:</b> keep SI inside the code, convert only for display. Check dimensions of every formula.</li>
<li><b>Limiting cases:</b> zero downforce should give √(µgr); infinite power should leave a grip-limited lap.</li>
<li><b>Known answers:</b> test against a hand calculation before trusting a complex case.</li>
<li><b>Convergence:</b> halve the step size; the answer should barely change.</li>
<li><b>Sanity checks:</b> are speeds, g levels and lap times plausible?</li>
<li><b>Version control:</b> Git, clear commit messages, so results can be reproduced.</li>
<li><b>Readable code:</b> small functions, clear names, comments for assumptions, tests.</li>
<li><b>Document assumptions</b> and limits: what the model does not include.</li></ul>
${WK('Example from this site', 'The lap sim tool here gives about 67.46 s on the balanced circuit at a 1 m step, 67.41 s at 0.5 m and 67.64 s at 2 m. The 1 m step is within about 0.05 s of the finer grid, which is fine for comparing setups (both use the same grid), but you would quote absolute times less precisely.')}
${TRAP('not validating your own tools. Interviewers like candidates who say how they checked their work.')}`,
say: 'I keep SI units internally, check limiting cases and known answers, run convergence tests, sanity-check the outputs, use version control and document assumptions. That is what lets someone else trust and reuse the tool.' });

LEARN.push({ id: 'track', title: 'Track characterisation', blurb: 'What each circuit demands',
html: `
<p class="lead">Pre-event preparation starts with what a circuit demands from the car. A few numbers describe a circuit well enough to choose a setup direction.</p>
<table><tr><th>Characteristic</th><th>How to measure it</th><th>Setup implication</th></tr>
<tr><td>Full-throttle fraction</td><td>Share of lap at full throttle</td><td>High: lower drag and wing levels</td></tr>
<tr><td>Corner speed mix</td><td>Time in slow, medium and fast corners</td><td>Slow: mechanical grip and traction; fast: aero</td></tr>
<tr><td>Braking severity</td><td>Number and strength of big stops</td><td>Brake cooling, stability, energy recovered</td></tr>
<tr><td>Energy</td><td>Energy recoverable against energy needed</td><td>Energy-limited circuits need careful deployment</td></tr>
<tr><td>Tyre energy</td><td>Combined loads, long corners</td><td>Tyre temperatures and degradation</td></tr>
<tr><td>Surface and kerbs</td><td>Bumps, kerb use</td><td>Ride height, springs, plank wear risk</td></tr>
<tr><td>Ambient conditions</td><td>Temperature, altitude, wind</td><td>Cooling, air density, gear ratios</td></tr></table>
<h2>Three archetypes</h2>
<ul><li><b>Power circuit:</b> long straights, slow chicanes. Low wing, top speed and traction.</li>
<li><b>Balanced circuit:</b> a mix; the optimum wing is a true trade-off.</li>
<li><b>Twisty circuit:</b> short straights, many slow corners. Maximum downforce, mechanical grip, traction.</li></ul>
<p>The three circuits in the <a href="#/tools/lapsim">lap sim</a> follow these archetypes. Compare their full-throttle fractions and best wing levels.</p>
${TRAP('describing circuits only by name. Describe what they demand from the car.')}`,
say: 'I would characterise a circuit by full-throttle fraction, the mix of slow and fast corners, braking severity, energy, tyre energy, surface and ambient conditions. That gives the setup direction: low drag for power circuits, maximum downforce and mechanical grip for twisty ones.' });

LEARN.push({ id: 'numerical', title: 'Numerical methods', blurb: 'Integration, interpolation and step size',
html: `
<p class="lead">Lap sims and post-processing are numerical: they integrate, interpolate and solve equations on a grid. Knowing how they can go wrong is part of trusting the result.</p>
<h2>Integration</h2>
${FX('Euler: y<sub>n+1</sub> = y<sub>n</sub> + h·f(t<sub>n</sub>, y<sub>n</sub>) (error ∝ h) &nbsp;&nbsp; RK4: four slope evaluations per step (error ∝ h⁴)')}
<p>Halving the step halves Euler's error but cuts RK4's by about 16 times. Stiff systems (very different time scales, such as tyre and chassis dynamics) can become unstable with explicit methods and large steps.</p>
<h2>Trapezium rule</h2>
<p>Lap time from speed samples: t = Σ Δs × ½(1 ÷ v<sub>i</sub> + 1 ÷ v<sub>i+1</sub>), or Δs ÷ average speed of the two points, as this site's lap sim does.</p>
<h2>Interpolation</h2>
<p>Laps are sampled in time, but comparisons need a common distance axis. Linear interpolation onto a distance grid is standard (numpy.interp). Never subtract channels sampled at different distances.</p>
<h2>Root finding</h2>
<p>Finding the maximum cornering speed is a root-finding problem: where lateral force demand equals grip. Bisection is robust; Newton's method is faster but needs a good start.</p>
<h2>Convergence</h2>
<p>Run the same problem at two step sizes. If the answer changes much, the step is too big.</p>
${WK('Worked example', 'Integrate dv/dt = −kv with k = 2, v(0) = 1 to t = 1. Exact: e<sup>−2</sup> = 0.1353. Euler with h = 0.5: (1 − 1)² = 0. With h = 0.25: 0.5⁴ = 0.0625. With h = 0.1: 0.8¹⁰ = 0.107. Euler converges slowly; RK4 with h = 0.5 already gives 0.375² = 0.1406.')}
${TRAP('not knowing what step size or convergence means. "I would halve the step and check the answer does not change" is a strong, simple answer.')}`,
say: 'Lap sims integrate on a grid, so I check convergence by halving the step size. Euler is first order and RK4 fourth order, and stiff systems need care. For comparing laps I interpolate onto a common distance grid, and root-finding like bisection gives corner speed limits.' });

LEARN.push({ id: 'signals', title: 'Signal processing', blurb: 'Sampling, filtering and frequencies',
html: `
<p class="lead">Car data is sampled and noisy. Basic signal processing lets you clean it without fooling yourself.</p>
<h2>Sampling and aliasing</h2>
<p>To capture a frequency f, sample faster than 2f (the Nyquist criterion). Sampling too slowly makes high frequencies look like low ones (aliasing), which is why data systems filter before sampling. Fast channels (damper positions, vibrations) are logged at higher rates than slow ones (temperatures).</p>
<h2>Filtering</h2>
<ul><li><b>Moving average:</b> simple, but delays the signal by about (N − 1) ÷ 2 samples and smears sharp events.</li>
<li><b>Butterworth low-pass:</b> a flat pass band; choose the cut-off frequency to keep the physics and remove noise.</li>
<li><b>Zero-phase filtering:</b> running the filter forwards then backwards (scipy.signal.filtfilt) removes the delay. Fine for analysis after the session, not for live data.</li></ul>
<h2>Differentiation amplifies noise</h2>
<p>Acceleration from differentiated speed is noisy, because differentiation multiplies each frequency component by its frequency. Filter first, or use a measured acceleration channel.</p>
<h2>Frequency analysis</h2>
<p>A Fourier transform (FFT) of a ride height or damper channel shows its frequency content: you can find the body's natural frequencies and see whether a setup change moved them.</p>
${WK('Worked example', 'A 100 Hz channel smoothed with an 11-sample moving average is delayed by (11 − 1) ÷ 2 = 5 samples = <b>0.05 s</b>. At 300 km/h (83.3 m/s) that shifts events by about <b>4.2 m</b> along the lap: enough to misplace a braking point.')}
<p>Try the <a href="#/tools/filter">filter tool</a> to see the lag.</p>
${TRAP('filtering without saying what it costs. Every filter trades smoothness for delay or distortion.')}`,
say: 'I would check the sample rate is above twice the frequencies of interest to avoid aliasing, filter with a cut-off chosen for the physics, and use zero-phase filtering offline to avoid delay. Differentiation amplifies noise, and an FFT shows natural frequencies in ride data.' });

LEARN.push({ id: 'optimisation', title: 'Optimisation and DoE', blurb: 'Beyond one change at a time',
html: `
<p class="lead">Setups have many interacting parameters. Changing one at a time misses interactions and wastes runs; design of experiments (DoE) and optimisation do better.</p>
<h2>One factor at a time (OFAT)</h2>
<p>Simple and clear, but it can miss the optimum when parameters interact: the best rear bar may depend on the front wing level.</p>
<h2>Design of experiments</h2>
<ul><li><b>Full factorial:</b> every combination of levels; 2 levels of k factors needs 2<sup>k</sup> runs. Reveals interactions.</li>
<li><b>Fractional factorial:</b> a chosen subset, when runs are expensive.</li>
<li><b>Latin hypercube:</b> spreads samples across a many-dimensional space for building surrogate models.</li></ul>
<h2>Response surfaces</h2>
<p>Fit a smooth model (often quadratic) of lap time against the parameters from the runs, then optimise the fitted model. Check it against fresh runs before trusting it.</p>
<h2>Optimisation</h2>
<ul><li><b>Local methods</b> (gradient-based) are fast but can stop at a local optimum.</li>
<li><b>Global methods</b> (multiple starts, genetic algorithms) explore more widely at higher cost.</li>
<li><b>Constraints</b> matter: ride height limits, plank wear, tyre temperatures, driver confidence.</li></ul>
${WK('Example', 'Three parameters at two levels each: a full factorial needs 2³ = <b>8 runs</b>. Five parameters at three levels would need 3⁵ = 243 runs, which is why fractional designs and surrogate models are used.')}
${TRAP('assuming the best values found one at a time combine into the best setup. Interactions can make that wrong.')}`,
say: 'Changing one thing at a time misses interactions. Design of experiments, such as full or fractional factorials, finds interactions efficiently, and response surfaces let you optimise a fitted model. I would watch for local optima and constraints like ride height and tyre temperatures.' });

LEARN.push({ id: 'uncertainty', title: 'Uncertainty and error propagation', blurb: 'How sure are you?',
html: `
<p class="lead">Every input and measurement has an uncertainty. Quoting a result without one hides how far it can be trusted.</p>
<h2>Error propagation</h2>
${FX('For f = x·y or x ÷ y: (δf ÷ f)² ≈ (δx ÷ x)² + (δy ÷ y)² &nbsp;&nbsp; For f = xⁿ: δf ÷ f = n · δx ÷ x')}
<p>These assume independent, small errors.</p>
${WK('Worked example', 'Downforce = ½ρV²C<sub>L</sub>A. If C<sub>L</sub>A is known to ±2% and speed to ±1%, the speed term contributes 2 × 1% = 2%. Combined: √(2² + 2²) ≈ <b>±2.8%</b> on downforce.')}
<h2>How many laps do you need?</h2>
${FX('n ≈ (z · σ ÷ E)²')}
<p>σ is lap-to-lap spread, E the precision you want on the mean, and z = 1.96 for 95% confidence.</p>
${WK('Worked example', 'σ = 0.1 s. To know the mean within ±0.05 s with 95% confidence: n = (1.96 × 0.1 ÷ 0.05)² = 15.4, so <b>16 laps</b>. Comparing two setups needs more, because both means are uncertain.')}
<h2>Systematic against random error</h2>
<p>Random errors average out with more data; systematic errors (a mis-calibrated sensor, a wrong tyre model) do not. Correlation hunts systematic errors.</p>
${TRAP('giving a precise-looking number with no idea of its uncertainty.')}`,
say: 'I would quote results with an uncertainty. For products the relative errors add in quadrature, and powers multiply the relative error. To get the mean within a target precision I would need about z sigma over E squared laps, and I would separate random errors, which average out, from systematic ones, which do not.' });

  FIAPR: '<a href="https://www.fia.com/news/new-era-competition-fia-showcases-future-focused-formula-1-regulations-2026-and-beyond" target="_blank" rel="noopener">FIA, "A new era of competition" (2026 regulations launch)</a>',
  FIAREF: '<a href="https://www.fia.com/news/refinements-2026-fia-formula-1-regulations-agreed-all-stakeholders" target="_blank" rel="noopener">FIA, "Refinements to the 2026 FIA Formula 1 regulations", 20 April 2026</a>',

  balance: ['GIL', 'MIL'], setup: ['MIL', 'GIL', 'SMITH'], braking: ['MIL', 'LIM'], energy: ['FIAPR', 'FIAC', 'FIAREF'], lapsim: ['SIE', 'LIM', 'PER', 'MIL'],
